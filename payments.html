// ── CONFIRM MODAL ─────────────────────────────────────────────────────────────
function ConfirmModal({icon,title,subtitle,confirmLabel,confirmStyle,onConfirm,onCancel,cancelLabel}){
return(
<div style={{position:“fixed”,inset:0,background:“rgba(0,0,0,0.88)”,display:“flex”,alignItems:“center”,justifyContent:“center”,zIndex:200,padding:20}} onClick={onCancel}>
<div onClick={e=>e.stopPropagation()} style={{background:CARD,borderRadius:22,padding:“28px 22px”,width:“100%”,maxWidth:360,border:`1px solid ${BORDER}`,animation:“popIn 0.2s ease”}}>
<div style={{display:“flex”,justifyContent:“center”,marginBottom:14}}>{icon}</div>
<div style={{fontWeight:900,fontSize:17,color:”#fff”,textAlign:“center”,marginBottom:subtitle?8:22}}>{title}</div>
{subtitle&&<div style={{fontSize:13,color:”#888”,textAlign:“center”,marginBottom:22,fontWeight:700}}>{subtitle}</div>}
<div style={{display:“flex”,gap:10}}>
<button onClick={onCancel} style={{flex:1,background:”#1c2030”,color:”#888”,border:“none”,borderRadius:12,padding:“14px”,fontWeight:700,fontSize:14}}>{cancelLabel}</button>
<button onClick={onConfirm} style={{flex:2,borderRadius:12,padding:“14px”,fontWeight:900,fontSize:15,border:“none”,…confirmStyle}}>{confirmLabel}</button>
</div>
</div>
</div>
);
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
const [lang,setLang]=useState(“fr”);
const [authUser,setAuthUser]=useState(undefined);
const [error,setError]=useState(””);

useEffect(()=>{
const unsub=auth.onAuthStateChanged(u=>setAuthUser(u));
return unsub;
},[]);

if(authUser===undefined) return(
<div style={{background:BG,minHeight:“100vh”,display:“flex”,alignItems:“center”,justifyContent:“center”}}>
<div style={{width:36,height:36,border:`3px solid ${G}`,borderTopColor:“transparent”,borderRadius:“50%”,animation:“spin 0.8s linear infinite”}}/>
</div>
);

if(!authUser) return <LoginScreen lang={lang} setLang={setLang} onError={setError} error={error}/>;
if(authUser.email!==ADMIN_EMAIL){
auth.signOut();
return <div style={{background:BG,minHeight:“100vh”,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#ff5555”,fontSize:16,fontWeight:800}}>{T[lang].errorAccess}</div>;
}
return <MainScreen lang={lang} setLang={setLang}/>;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginScreen({lang,setLang,onError,error}){
const t=T[lang],isRTL=lang===“ar”;
const [email,setEmail]=useState(””);
const [password,setPassword]=useState(””);
const [loading,setLoading]=useState(false);

const handleLogin=async()=>{
setLoading(true);
try{ await auth.signInWithEmailAndPassword(email,password); }
catch(e){ onError(t.errorAccess); }
setLoading(false);
};

return(
<div style={{fontFamily:isRTL?”‘Cairo’,sans-serif”:”‘Nunito’,sans-serif”,direction:isRTL?“rtl”:“ltr”,background:BG,minHeight:“100vh”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,padding:24}}>
<AppLogo/>
<div style={{fontSize:28,fontWeight:900,color:G,letterSpacing:-0.5,marginBottom:4}}>StadBook</div>
<div style={{fontSize:13,color:”#444”,marginBottom:32}}>{t.appDesc}</div>
<div style={{display:“flex”,gap:8,marginBottom:24}}>
{[“fr”,“en”,“ar”].map(l=>(
<button key={l} onClick={()=>setLang(l)} style={{background:lang===l?G:CARD,border:`1.5px solid ${lang===l?G:BORDER}`,borderRadius:10,padding:“6px 12px”,fontWeight:800,fontSize:12,color:lang===l?”#001a0e”:”#555”}}>
{FLAGS[l]} {LANG_LABELS[l]}
</button>
))}
</div>
<div style={{background:CARD,borderRadius:20,padding:“24px 20px”,width:“100%”,maxWidth:360,border:`1px solid ${BORDER}`}}>
<div style={{marginBottom:14}}>
<div style={{fontSize:10,color:”#555”,fontWeight:700,marginBottom:6}}>{t.email.toUpperCase()}</div>
<input value={email} onChange={e=>setEmail(e.target.value)} type=“email”
style={{width:“100%”,background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:“12px 14px”,color:”#fff”,fontSize:15}}
onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
</div>
<div style={{marginBottom:20}}>
<div style={{fontSize:10,color:”#555”,fontWeight:700,marginBottom:6}}>{t.password.toUpperCase()}</div>
<input value={password} onChange={e=>setPassword(e.target.value)} type=“password”
onKeyDown={e=>e.key===“Enter”&&handleLogin()}
style={{width:“100%”,background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:“12px 14px”,color:”#fff”,fontSize:15}}
onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
</div>
{error&&<div style={{background:”#1f0e0e”,border:“1px solid #2e1414”,borderRadius:10,padding:“10px 14px”,color:”#ff5555”,fontSize:13,marginBottom:14,fontWeight:700}}>{error}</div>}
<button onClick={handleLogin} disabled={loading} style={{width:“100%”,background:G,color:”#001a0e”,border:“none”,borderRadius:12,padding:“14px”,fontWeight:900,fontSize:15,opacity:loading?0.7:1}}>
{loading?t.loading:t.loginBtn}
</button>
</div>
</div>
);
}

  <div style={{display:"flex",flexDirection:"column",gap:10}}>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:10}}>

                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                <div style={{fontSize:17,fontWeight:900,color:paid?G:"#fff"}}>{totalDue} <span style={{fontSize:10,color:"#444"}}>{t.currency}</span></div>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setConfirm({type:paid?"partnerUnpaid":"partnerPaid",pid:p.id,name:p.name})}
                    style={{background:paid?"#0b2018":"#ff555518",color:paid?G:"#ff5555",border:`1.5px solid ${paid?G+"55":"#ff555533"}`,borderRadius:8,padding:"6px 10px",fontWeight:900,fontSize:10,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4}}>
                    {paid?<><IconCheck size={10}/> {t.paid}</>:t.markPartnerPaid}

                  <button onClick={()=>setConfirm({type:"deletePartner",pid:p.id,name:p.name})}

// ── ADD PARTNER MODAL ─────────────────────────────────────────────────────────
function AddPartnerModal({t,onAdd,onClose}){
const [name,setName]=useState(””);
const [phone,setPhone]=useState(””);
return(
<div style={{position:“fixed”,inset:0,background:“rgba(0,0,0,0.88)”,display:“flex”,alignItems:“center”,justifyContent:“center”,zIndex:200,padding:20}} onClick={onClose}>
<div onClick={e=>e.stopPropagation()} style={{background:CARD,borderRadius:22,padding:“28px 22px”,width:“100%”,maxWidth:380,border:`1px solid ${BORDER}`,animation:“popIn 0.2s ease”}}>
<div style={{fontSize:11,color:”#555”,fontWeight:700,marginBottom:20,display:“flex”,alignItems:“center”,gap:6,letterSpacing:0.5}}><IconUser/> {t.newPartner.toUpperCase()}</div>
<div style={{marginBottom:12}}>
<div style={{fontSize:10,color:”#555”,fontWeight:700,marginBottom:6}}>{t.partnerName.toUpperCase()}</div>
<input value={name} onChange={e=>setName(e.target.value)} autoFocus
style={{width:“100%”,background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:“13px 15px”,color:”#fff”,fontSize:15}}
onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
</div>
<div style={{marginBottom:22}}>
<div style={{fontSize:10,color:”#555”,fontWeight:700,marginBottom:6}}>{t.phone.toUpperCase()}</div>
<input value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,””))} type=“tel” inputMode=“numeric”
style={{width:“100%”,background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:“13px 15px”,color:”#fff”,fontSize:15}}
onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
</div>
<div style={{display:“flex”,gap:10}}>
<button onClick={onClose} style={{flex:1,background:”#1c2030”,color:”#666”,border:“none”,borderRadius:12,padding:“14px”,fontWeight:700,fontSize:14}}>{t.cancel}</button>
<button onClick={()=>{if(!name.trim()) return;onAdd(name,phone);onClose();}}
disabled={!name.trim()}
style={{flex:2,background:name.trim()?G:”#0e2018”,color:name.trim()?”#001a0e”:”#1a3a28”,border:“none”,borderRadius:12,padding:“14px”,fontWeight:900,fontSize:15,display:“flex”,alignItems:“center”,justifyContent:“center”,gap:6}}>
<IconPlus size={14} color={name.trim()?”#001a0e”:”#1a3a28”}/> {t.addPartner}
</button>
</div>
</div>
</div>
);
