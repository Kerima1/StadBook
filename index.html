function cleanupEmptyBookingDates(bookings){
  Object.keys(bookings || {}).forEach(date=>{
    if(!bookings[date] || Object.keys(bookings[date]).length===0){
      delete bookings[date];
    }
  });
  return bookings;
}

function DayPicker({days,onChange,month,year,bookedDays,lang,playedDays}){
  const grid=getMonthGrid(year,month);
  const ds=DAYS_SHORT[lang]||DAYS_SHORT.fr;
  const now=new Date();
  return(
    <div style={{background:"#0D0F18",borderRadius:12,padding:"12px",border:"1px solid #1c2030"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
        {ds.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#444"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {grid.map((d,i)=>{
          if(!d) return <div key={i}/>;
          const on=days.includes(d.getDate());
          const taken=bookedDays&&bookedDays.includes(d.getDate())&&!on;
          const played=playedDays&&playedDays.includes(d.getDate());
          const isPast=new Date(d.getFullYear(),d.getMonth(),d.getDate()) < new Date(now.getFullYear(),now.getMonth(),now.getDate());
          const locked=(played||isPast||(taken && !on));
          return(
            <button key={i} type="button"
              onClick={e=>{e.stopPropagation();if(!locked)onChange(on?days.filter(x=>x!==d.getDate()):[...days,d.getDate()].sort((a,b)=>a-b));}}
              style={{background:on?(played?"#004d28":"#00D48A"):taken?"#1a0e0e":"#1c2030",borderRadius:8,padding:"7px 2px",textAlign:"center",fontSize:13,fontWeight:900,color:on?(played?"#00D48A":"#001a0e"):taken?"#3a1a1a":"#555",border:taken?"1px solid #2e1414":played&&on?"1px solid #00D48A":"none",cursor:locked?"not-allowed":"pointer",opacity:locked?0.6:1}}>
              {d.getDate()}
            </button>
          );
        })}
      </div>
    </div>
  );
}

      <div style={{marginBottom:0}}>
        <div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6}}>{t.subTotal.toUpperCase()} ({t.currency})</div>

          style={{width:"100%",background:"#0D0F18",border:"2px solid #1c2030",borderRadius:12,padding:"13px 15px",color:"#fff",fontSize:15}}
          onFocus={e=>e.target.style.borderColor="#00D48A"} onBlur={e=>{onChange({...data,totalPrice:e.target.value.replace(/[^0-9]/g,"")});e.target.style.borderColor="#1c2030";}}/>
      </div>
    </>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState("fr");
  const [authUser,setAuthUser]=useState(undefined);
  const [userDoc,setUserDoc]=useState(null);
  const [contactInfo,setContactInfo]=useState({whatsapp:"",messages:{fr:"Besoin d'accès ? Contactez-nous sur WhatsApp.",en:"Need access? Contact us on WhatsApp.",ar:"تريد الوصول؟ تواصل معنا على واتساب."}});

  useEffect(()=>{
    // Load contact info - works before and after login
    const unsub=db.collection("settings").doc("contact").onSnapshot(snap=>{
      if(snap.exists) setContactInfo(snap.data());
    },err=>{
      db.collection("settings").doc("contact").get().then(s=>{ if(s.exists) setContactInfo(s.data()); }).catch(()=>{});
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async u=>{
      if(u){
        setAuthUser(u);
        if(u.email===ADMIN_EMAIL){ setUserDoc({isAdmin:true}); return; }
        // Listen to user doc in real time
        const docUnsub=db.collection("users").doc(u.uid).onSnapshot(snap=>{
          setUserDoc(snap.exists?{id:snap.id,...snap.data()}:null);
        });
        return docUnsub;
      } else {
        setAuthUser(null);
        setUserDoc(null);
      }
    });
    return unsub;
  },[]);

  if(authUser===undefined) return(
    <div style={{background:BG,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:40,height:40,border:`3px solid ${G}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{color:G,fontSize:16,fontWeight:800}}>StadBook</div>
    </div>
  );

  if(!authUser) return <AuthScreen lang={lang} setLang={setLang} contactInfo={contactInfo}/>;
  if(authUser.email===ADMIN_EMAIL) return <AdminPanel lang={lang} setLang={setLang} contactInfo={contactInfo} setContactInfo={setContactInfo}/>;
  if(!userDoc||!userDoc.active) return <PendingScreen lang={lang} setLang={setLang} contactInfo={contactInfo}/>;
  return <StadBookApp lang={lang} setLang={setLang} user={userDoc} uid={authUser.uid}/>;
}

function AdminPanel({lang,setLang,contactInfo,setContactInfo}){

                        <button onClick={()=>setDeleteTarget(u)} style={{background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:8,padding:"6px 10px",fontWeight:800,fontSize:11}}>🗑️</button>

              <div style={{fontSize:11,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:14}}>{t.contactInfo.toUpperCase()}</div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6}}>WHATSAPP</div>
                <input value={tempWA} onChange={e=>setTempWA(e.target.value.replace(/\D/g,""))} type="tel" inputMode="numeric" pattern="[0-9]*"
                  style={{width:"100%",background:BG,border:`2px solid ${BORDER}`,borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:15}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
              </div>

              <button onClick={handleSaveContact} disabled={translating} style={{width:"100%",background:translating?"#1c2030":G,color:translating?"#555":"#001a0e",border:"none",borderRadius:10,padding:"12px",fontWeight:900,fontSize:14}}>
                {saveMsg?saveMsg:translating?t.translating:t.saveContact}

            <div style={{background:`${G}15`,borderRadius:16,padding:"14px 16px",border:`1.5px solid ${G}55`}}>
              <div style={{fontSize:10,color:G,fontWeight:800,marginBottom:8}}>{lang==="ar"?"معاينة":lang==="fr"?"APERÇU":"PREVIEW"}</div>
              <div style={{fontSize:13,color:G,fontWeight:800,marginBottom:4}}>📞 {tempWA||"—"}</div>
              <div style={{fontSize:12,color:"#666"}}>{tempMsg||"—"}</div>

      {/* Delete modal */}
      {resetTarget&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:99,padding:20}}>
          <div style={{background:CARD,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:360,border:`1px solid #00b8ff44`}}>
            <div style={{fontSize:24,textAlign:"center",marginBottom:14}}>🔑</div>
            <div style={{fontWeight:900,fontSize:16,color:"#fff",marginBottom:4,textAlign:"center"}}>
              {lang==="ar"?"تغيير كلمة المرور":lang==="fr"?"Changer le mot de passe":"Change Password"}
            </div>
            <div style={{fontSize:12,color:"#555",textAlign:"center",marginBottom:20}}>{resetTarget.stadiumName} — {resetTarget.email}</div>
            <div style={{fontSize:13,color:"#aaa",textAlign:"center",marginBottom:8,lineHeight:1.6}}>
              {lang==="ar"?"سيتم إرسال بريد إعادة تعيين كلمة المرور إلى:":lang==="fr"?"Un email de réinitialisation sera envoyé à :":"A password reset email will be sent to:"}
            </div>
            <div style={{fontSize:14,color:"#00b8ff",fontWeight:800,textAlign:"center",marginBottom:16}}>{resetTarget?.email}</div>
            {resetMsg&&<div style={{fontSize:13,color:resetMsg.includes("✓")?G:"#ff5555",fontWeight:700,marginBottom:10,textAlign:"center"}}>{resetMsg}</div>}
            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button onClick={()=>{setResetTarget(null);setNewPass("");setResetMsg("");}} style={{flex:1,background:"#1c2030",color:"#888",border:"none",borderRadius:12,padding:"13px",fontWeight:700,fontSize:14}}>{lang==="ar"?"إلغاء":lang==="fr"?"Annuler":"Cancel"}</button>
              <button onClick={handleResetPassword} disabled={resetting} style={{flex:2,background:"#00b8ff",color:"#001020",border:"none",borderRadius:12,padding:"13px",fontWeight:900,fontSize:14,opacity:resetting?0.7:1}}>
                {resetting?(lang==="ar"?"جارٍ...":lang==="fr"?"En cours...":"Processing..."):(lang==="ar"?"تأكيد":lang==="fr"?"Confirmer":"Confirm")}
              </button>
            </div>
          </div>
        </div>
      )}

      {deleteTarget&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:99,padding:20}}>
          <div style={{background:CARD,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:360,border:"1px solid #2e1414"}}>
            <div style={{fontSize:32,textAlign:"center",marginBottom:14}}>⚠️</div>
            <div style={{fontWeight:900,fontSize:16,color:"#fff",marginBottom:8,textAlign:"center"}}>{t.confirmDelete}</div>
            <div style={{fontSize:13,color:"#ff5555",fontWeight:700,textAlign:"center",marginBottom:6}}>{deleteTarget.stadiumName}</div>
            <div style={{fontSize:12,color:"#444",textAlign:"center",marginBottom:24}}>{deleteTarget.email}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDeleteTarget(null)} style={{flex:1,background:"#1c2030",color:"#888",border:"none",borderRadius:12,padding:"13px",fontWeight:700,fontSize:14}}>{t.cancel}</button>
              <button onClick={()=>deleteUser(deleteTarget.id)} style={{flex:1,background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:12,padding:"13px",fontWeight:900,fontSize:14}}>🗑️</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function StadBookApp({lang,setLang,user,uid}){
  const [tab,setTab]=useState("home");
  const [price,setPrice]=useState(user?.price||500);
  const [stadiumName,setStadiumName]=useState(user?.stadiumName||"Mon Terrain");
  const [editingPrice,setEditingPrice]=useState(false);
  const [editingName,setEditingName]=useState(false);
  const [tempPrice,setTempPrice]=useState(price);
  const [tempName,setTempName]=useState(stadiumName);
  const [bookings,setBookings]=useState({});
  const [selectedDate,setSelectedDate]=useState(new Date());
  const [calView,setCalView]=useState("day");
  const [modal,setModal]=useState(null); // null | hour number
  const [editModal,setEditModal]=useState(null); // {dk,h,slot}
  const [bookName,setBookName]=useState("");
  const [bookPhone,setBookPhone]=useState("");
  const [bookPrice,setBookPrice]=useState("");
  const [earnSubTab,setEarnSubTab]=useState("month");
  const [monthDetail,setMonthDetail]=useState(null);
  const [subsData,setSubsData]=useState([]);
  const [subsView,setSubsView]=useState("list"); // list | detail
  const [subsListTab,setSubsListTab]=useState("active");
  const [activeSubId,setActiveSubId]=useState(null);
  const [subModal,setSubModal]=useState(null); // null|"new"|"edit"|"addPay"|"editPay"|"del"
  const [subForm,setSubForm]=useState({name:"",phone:"",hour:10,month:new Date().getMonth(),year:new Date().getFullYear(),days:[],totalPrice:""});
  const [editPayData,setEditPayData]=useState(null);
  const [payAmount,setPayAmount]=useState("");
  const [confirmPlaySlot,setConfirmPlaySlot]=useState(null); // {dk,h}
  const [confirmCancelSlot,setConfirmCancelSlot]=useState(null); // {dk,h}
  const [earnMainTab,setEarnMainTab]=useState("matches"); // matches|subs|total
  const [earnSubTab2,setEarnSubTab2]=useState("month"); // month|all
  const [monthDetailMatches,setMonthDetailMatches]=useState(null);
  const [monthDetailSubs,setMonthDetailSubs]=useState(null);
  const [monthDetailTotal,setMonthDetailTotal]=useState(null);

  const t=T[lang],isRTL=lang==="ar";
  const todayKey=toKey(new Date());
  const dateKey=toKey(selectedDate);
  const localeStr=lang==="ar"?"ar-EG":lang==="fr"?"fr-FR":"en-US";

  // Sync user doc changes (price, stadiumName)
  useEffect(()=>{
    if(user?.price) setPrice(user.price);
    if(user?.stadiumName) setStadiumName(user.stadiumName);
  },[user]);

  // Real-time bookings
  useEffect(()=>{
    if(!uid) return;
    const unsub=db.collection("bookings").doc(uid).onSnapshot(snap=>{
      setBookings(snap.exists?(snap.data().data||{}):{});
    });
    return unsub;
  },[uid]);

  const saveBookings=useCallback(async(nb)=>{
    nb = cleanupEmptyBookingDates({...nb});
    setBookings(nb);
    await db.collection("bookings").doc(uid).set({data:nb},{merge:true});
  },[uid]);

  const saveSettings=async(np,nn)=>{
    await db.collection("users").doc(uid).update({price:np,stadiumName:nn});
  };

  // Subs Firebase
  useEffect(()=>{
    if(!uid) return;
    const unsub=db.collection("subs").doc(uid).onSnapshot(snap=>{
      setSubsData(snap.exists?(snap.data().list||[]):[]);
    });
    return unsub;
  },[uid]);

  const saveSubs=useCallback(async(list)=>{
    setSubsData(list);
    await db.collection("subs").doc(uid).set({list},{merge:false});
  },[uid]);

  const sortedSubs=[...subsData].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const activeSub=sortedSubs.find(s=>s.id===activeSubId)||null;

  // Get days already booked for a given hour/month/year (to gray out in day picker)
  const getBookedDaysForHour=useCallback((hour,month,year,excludeSubId)=>{
    const booked=[];
    // Check regular bookings
    for(const [dk,slots] of Object.entries(bookings)){
      const d=new Date(dk+"T12:00:00");
      if(d.getFullYear()===year&&d.getMonth()===month&&slots[hour]){
        booked.push(d.getDate());
      }
    }
    // Check other subscriptions same hour/month/year
    for(const s of subsData){
      if(s.id===excludeSubId) continue;
      if(s.hour===hour&&s.month===month&&s.year===year){
        for(const day of s.days) if(!booked.includes(day)) booked.push(day);
      }
    }
    return booked;
  },[bookings,subsData]);

  // Get days already played for a subscription (to lock in day picker)
  const getPlayedDaysForSub=useCallback((sub)=>{
    if(!sub) return [];
    const played=[];
    for(const day of sub.days){
      const dk=`${sub.year}-${String(sub.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      if(bookings[dk]&&bookings[dk][sub.hour]&&bookings[dk][sub.hour].status==="played"){
        played.push(day);
      }
    }
    return played;
  },[bookings]);

  // Auto-book subscription days into schedule
  const bookSubDays=useCallback(async(sub,oldSub)=>{
    let nb={...bookings};
    // Remove old sub days if editing (patched anti-duplicate logic)
    if(oldSub){
      for(const day of oldSub.days){
        const dk=`${oldSub.year}-${String(oldSub.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
		if(nb[dk]&&nb[dk][oldSub.hour]&&nb[dk][oldSub.hour].subId===oldSub.id){

		  const d={...nb[dk]};
		  Object.keys(d).forEach(k=>{
			if(d[k] && d[k].subId===oldSub.id){
			   delete d[k];
		  }
		 });

		  if(Object.keys(d).filter(k=>d[k]).length===0){

			const copy={...nb};
			delete copy[dk];
			nb=copy;

		  }else{

			nb={
			  ...nb,
			  [dk]:d
			};

		  }
		}
      }
    }
    // Add new sub days
    for(const day of sub.days){
      const dk=`${sub.year}-${String(sub.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      nb={...nb,[dk]:{...(nb[dk]||{}),[sub.hour]:{name:sub.name,phone:sub.phone,price:0,status:"reserved",subId:sub.id}}};
    }
    await saveBookings(nb);
  },[bookings,saveBookings]);

  // Add sub payment → goes to earnings + auto-archive if fully paid
  const addSubPayment=useCallback(async(subId,amount)=>{
    const sub=subsData.find(s=>s.id===subId);
    if(!sub) return;
    const paid=sub.payments.reduce((a,p)=>a+p.amount,0);
    if(amount<=0||amount>sub.totalPrice-paid) return;
    const newPayment={id:"py"+Date.now(),amount,date:toKey(new Date())};
    const newPayments=[...sub.payments,newPayment];
    const newPaid=paid+amount;
    const isFullyPaid=newPaid>=sub.totalPrice;
    const updated={...sub,payments:newPayments,archived:isFullyPaid};
    const newList=subsData.map(s=>s.id===subId?updated:s);
    await saveSubs(newList);
    // Payments are stored only inside subscription data to avoid fake matches in bookings/earnings
    return;
  },[subsData,saveSubs,bookings,saveBookings]);

  // Edit sub payment
  const editSubPayment=useCallback(async(subId,payId,newAmount)=>{
    const sub=subsData.find(s=>s.id===subId);
    if(!sub) return;

    const oldPayment=sub.payments.find(p=>p.id===payId);
    if(!oldPayment) return;

    const updatedPayments=sub.payments.map(p=>
      p.id===payId ? {...p,amount:Number(newAmount)} : p
    );

    const updated={
      ...sub,
      payments:updatedPayments
    };

    const totalPaid=updatedPayments.reduce((a,p)=>a+(Number(p.amount)||0),0);
    updated.archived=totalPaid>=sub.totalPrice;

    await saveSubs(
      subsData.map(s=>s.id===subId?updated:s)
    );

    return;
  },[subsData,saveSubs,bookings,saveBookings]);

  // Delete sub payment
  const deleteSubPayment=useCallback(async(subId,payId)=>{
    const sub=subsData.find(s=>s.id===subId);
    if(!sub) return;

    const payment=sub.payments.find(p=>p.id===payId);

    const updatedPayments=sub.payments.filter(p=>p.id!==payId);

    const totalPaid=updatedPayments.reduce((a,p)=>a+(Number(p.amount)||0),0);

    const updated={
      ...sub,
      payments:updatedPayments,
      archived:totalPaid>=sub.totalPrice
    };

    await saveSubs(
      subsData.map(s=>s.id===subId?updated:s)
    );

    return;
  },[subsData,saveSubs,bookings,saveBookings]);

  const getSlot=(dk,h)=>bookings[dk]?.[h];
  const daySlots=bookings[dateKey]||{};

  const todayEarnings=useMemo(()=>Object.values(bookings[todayKey]||{}).filter(s=>s.status==="played").reduce((a,s)=>a+(s.price||0),0),[bookings,todayKey]);
  const monthBookings=useMemo(()=>{
    const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
    let c=0;
    for(const dk of Object.keys(bookings)){const d=new Date(dk+"T12:00:00");if(d.getFullYear()===yr&&d.getMonth()===mo)c+=Object.keys(bookings[dk]).length;}
    return c;
  },[bookings]);

  const countFor=(dk,status=null)=>{const s=bookings[dk]||{};const entries=Object.entries(s).filter(([k])=>!isNaN(Number(k)));if(!status)return entries.length;return entries.filter(([,x])=>x.status===status).length;};

  const confirmBook=async()=>{
    if(!bookName.trim()||!bookPhone.trim()||!bookPrice) return;
    const nb={...bookings,[dateKey]:{...(bookings[dateKey]||{}),[modal]:{name:bookName.trim(),phone:bookPhone.trim(),price:Number(bookPrice),status:"reserved"}}};
    await saveBookings(nb);
    setBookName("");setBookPhone("");setBookPrice("");setModal(null);
  };

  const confirmEdit=async()=>{
    if(!editModal||!bookName.trim()||!bookPhone.trim()||!bookPrice) return;
    const {dk,h}=editModal;
    const nb={...bookings,[dk]:{...(bookings[dk]||{}),[h]:{...bookings[dk][h],name:bookName.trim(),phone:bookPhone.trim(),price:Number(bookPrice)}}};
    await saveBookings(nb);
    setBookName("");setBookPhone("");setBookPrice("");setEditModal(null);
  };

  const cancelSlot=async(dk,h)=>{
    await db.collection("bookings").doc(uid).update({
      [`data.${dk}.${h}`]: firebase.firestore.FieldValue.delete()
    }).catch(()=>{});
    const day={...(bookings[dk]||{})};
    delete day[h];
    const nb={...bookings};
    if(Object.keys(day).length===0){
      delete nb[dk];
      await db.collection("bookings").doc(uid).update({
        [`data.${dk}`]: firebase.firestore.FieldValue.delete()
      }).catch(()=>{});
    } else {
      nb[dk]=day;
    }
    setBookings(nb);
  };
  const playSlot=async(dk,h)=>await saveBookings({...bookings,[dk]:{...(bookings[dk]||{}),[h]:{...bookings[dk][h],status:"played"}}});
  const goToDay=d=>{setSelectedDate(new Date(d));setCalView("day");setTab("schedule");};

  const NAV=[{id:"home",icon:<HomeIcon/>,label:t.home},{id:"schedule",icon:<CalIcon/>,label:t.schedule},{id:"earnings",icon:<EarnIcon/>,label:t.earnings},{id:"subs",icon:<SubIcon/>,label:t.subs},{id:"reports",icon:<ReportIcon/>,label:t.reports},{id:"settings",icon:<SettIcon/>,label:t.settings}];

  const SlotCard=({h,dk})=>{
    const slot=getSlot(dk,h),isPlayed=slot?.status==="played",isReserved=slot?.status==="reserved";
    const isPast=!slot&&toKey(new Date(dk+"T12:00:00"))<todayKey;
    return(
      <div style={{background:isPlayed?"#071510":isReserved?"#0b1a13":CARD,border:`1.5px solid ${isPlayed?G+"44":isReserved?G+"66":BORDER}`,borderRadius:14,padding:"11px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",opacity:isPast?0.3:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{minWidth:46,height:46,borderRadius:11,flexShrink:0,background:isPlayed?G+"22":isReserved?G:"#161b28",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:14,fontWeight:900,lineHeight:1.1,color:isReserved&&!isPlayed?"#001a0e":isPlayed?G:"#333"}}>{h===0?12:h>12?h-12:h}</span>
            <span style={{fontSize:8,fontWeight:700,color:isReserved&&!isPlayed?"#003a20":isPlayed?G+"99":"#222"}}>{h>=12?"PM":"AM"}</span>
          </div>
          <div>
            {slot?(<>
              <div style={{fontWeight:800,fontSize:14,color:isPlayed?"#666":"#fff"}}>{slot.name}</div>
              {slot.phone&&<div style={{fontSize:11,color:"#444",marginTop:1}}>📞 {slot.phone}</div>}
              <div style={{fontSize:11,marginTop:1,color:isPlayed?G+"88":G+"99",fontWeight:700}}>{isPlayed?`✓ ${t.played}`:`● ${t.booked}`} · {slot.subId?(lang==="ar"?"اشتراك":lang==="fr"?"Abonnement":"Subscription"):`${slot.price||0} ${t.currency}`}</div>
            </>):(<div style={{color:"#2a2f45",fontSize:12,fontWeight:600}}>{fmt24(h)}</div>)}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {isPlayed?<Check size={28} color={G}/>
          :isReserved?(<>
            {!slot.subId&&<button onClick={()=>setConfirmCancelSlot({dk,h})} style={{background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:8,padding:"6px 10px",fontWeight:700,fontSize:11}}>{t.cancel}</button>}
            <button onClick={()=>setConfirmPlaySlot({dk,h})} style={{background:G,color:G_DARK,border:"none",borderRadius:8,padding:"6px 10px",fontWeight:900,fontSize:11,display:"flex",alignItems:"center",gap:4}}>
              <svg width="10" height="10" viewBox="0 0 12 12" fill={G_DARK}><polygon points="2,1 11,6 2,11"/></svg>{t.play}
            </button>
            {!slot.subId&&<button onClick={()=>{setEditModal({dk,h,slot});setBookName(slot.name);setBookPhone(slot.phone);setBookPrice(String(slot.price||""));}} style={{background:"#1c2030",color:G,border:`1px solid ${G}44`,borderRadius:8,padding:"6px 9px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center"}}><PenIcon/></button>}
          </>)
          :<button onClick={()=>{setSelectedDate(new Date(dk+"T12:00:00"));setModal(h);}} style={{background:G,color:"#001a0e",border:"none",borderRadius:8,padding:"7px 13px",fontWeight:900,fontSize:12}}>{t.book}</button>}
        </div>
      </div>
    );
  };

  const HomeTab=()=>{
    const ts=bookings[todayKey]||{};
    const played=Object.values(ts).filter(s=>s.status==="played").length;
    const reserved=Object.values(ts).filter(s=>s.status==="reserved").length;
    return(
      <div style={{padding:"16px 14px"}}>
        <div style={{marginBottom:16,padding:"14px 16px",background:CARD,borderRadius:16,border:`1px solid ${BORDER}`}}>
          <div style={{fontSize:11,color:"#444",fontWeight:700,marginBottom:4}}>⚽ {t.stadium}</div>
          <div style={{fontSize:22,fontWeight:900,color:G}}>{stadiumName}</div>

const EarningsTab=()=>{
    const now=new Date(),curYr=now.getFullYear(),curMo=now.getMonth();

    // ── MATCHES DATA ──
    const matchTodayE=useMemo(()=>Object.values(bookings[todayKey]||{}).filter(s=>s.status==="played"&&!s.subId).reduce((a,s)=>a+(s.price||0),0),[bookings,todayKey]);
    const matchMonthE=useMemo(()=>{let s=0;for(const [dk,slots] of Object.entries(bookings)){const d=new Date(dk+"T12:00:00");if(d.getFullYear()===curYr&&d.getMonth()===curMo)for(const x of Object.values(slots))if(x.status==="played"&&!x.subId)s+=(x.price||0);}return s;},[bookings]);
    const matchAllE=useMemo(()=>{let s=0;for(const dk of Object.keys(bookings))for(const x of Object.values(bookings[dk]))if(x.status==="played"&&!x.subId)s+=(x.price||0);return s;},[bookings]);
    const matchCurMonthDays=Object.entries(bookings).filter(([dk])=>{const d=new Date(dk+"T12:00:00");return d.getFullYear()===curYr&&d.getMonth()===curMo&&Object.values(bookings[dk]).some(s=>s.status==="played"&&!s.subId);}).sort(([a],[b])=>b.localeCompare(a));
    const matchAllMonths=useMemo(()=>{const map={};for(const [dk,slots] of Object.entries(bookings)){const d=new Date(dk+"T12:00:00");const key=`${d.getFullYear()}-${d.getMonth()}`;if(!map[key])map[key]={year:d.getFullYear(),month:d.getMonth(),earned:0,count:0};for(const x of Object.values(slots))if(x.status==="played"&&!x.subId){map[key].earned+=(x.price||0);map[key].count++;}}return Object.values(map).sort((a,b)=>b.year-a.year||b.month-a.month);},[bookings]);

    // ── SUBS DATA ──
    const subTodayE=useMemo(()=>subsData.reduce((a,s)=>a+s.payments.filter(p=>p.date===todayKey).reduce((b,p)=>b+(Number(p.amount)||0),0),0),[subsData,todayKey]);
    const subMonthE=useMemo(()=>subsData.reduce((a,s)=>a+s.payments.filter(p=>{const d=new Date(p.date+"T12:00:00");return d.getFullYear()===curYr&&d.getMonth()===curMo;}).reduce((b,p)=>b+(Number(p.amount)||0),0),0),[subsData]);
    const subAllE=useMemo(()=>subsData.reduce((a,s)=>a+s.payments.reduce((b,p)=>b+(Number(p.amount)||0),0),0),[subsData]);
    const subAllMonths=useMemo(()=>{const map={};for(const s of subsData)for(const p of s.payments){const d=new Date(p.date+"T12:00:00");const key=`${d.getFullYear()}-${d.getMonth()}`;if(!map[key])map[key]={year:d.getFullYear(),month:d.getMonth(),earned:0,payments:[]};map[key].earned+=(Number(p.amount)||0);map[key].payments.push({...p,subName:s.name});}return Object.values(map).sort((a,b)=>b.year-a.year||b.month-a.month);},[subsData]);
    const subCurMonthPayments=subsData.flatMap(s=>s.payments.filter(p=>{const d=new Date(p.date+"T12:00:00");return d.getFullYear()===curYr&&d.getMonth()===curMo;}).map(p=>({...p,subName:s.name}))).sort((a,b)=>b.date.localeCompare(a.date));
    // group sub payments by date
    const subCurMonthByDay=subCurMonthPayments.reduce((map,p)=>{if(!map[p.date])map[p.date]=[];map[p.date].push(p);return map;},{});

    // ── TOTAL DATA ──
    const totalTodayE=matchTodayE+subTodayE;
    const totalMonthE=matchMonthE+subMonthE;
    const totalAllE=matchAllE+subAllE;

    const statCard=(label,value,color,bg,border)=>(
      <div style={{background:bg,borderRadius:18,padding:"20px 18px",border:`1px solid ${border}`,marginBottom:12}}>
        <div style={{fontSize:10,color:color+"99",fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{label.toUpperCase()}</div>
        <div style={{fontSize:38,fontWeight:900,color:color,lineHeight:1}}>{value}</div>
        <div style={{fontSize:14,color:color+"77",marginTop:4}}>{t.currency}</div>
      </div>
    );

    // ── MONTH DETAIL VIEWS ──
    if(monthDetailMatches){
      const {year:my,month:mm}=monthDetailMatches;
      const days=Object.entries(bookings).filter(([dk])=>{const d=new Date(dk+"T12:00:00");return d.getFullYear()===my&&d.getMonth()===mm&&Object.values(bookings[dk]).some(s=>s.status==="played"&&!s.subId);}).sort(([a],[b])=>b.localeCompare(a));
      const mTotal=days.reduce((s,[,sl])=>s+Object.values(sl).filter(x=>x.status==="played"&&!x.subId).reduce((a,x)=>a+(x.price||0),0),0);
      return(
        <div style={{padding:"16px 14px 120px"}}>
          <button onClick={()=>setMonthDetailMatches(null)} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"8px 16px",color:"#888",fontWeight:700,fontSize:13,marginBottom:16}}>←</button>
          <div style={{background:"linear-gradient(135deg,#0b2018,#0e2a1e)",borderRadius:18,padding:"20px 18px",border:`1px solid ${G}44`,marginBottom:16}}>
            <div style={{fontSize:12,color:G+"99",fontWeight:700,marginBottom:4}}>{new Date(my,mm,1).toLocaleDateString(localeStr,{month:"long",year:"numeric"}).toUpperCase()}</div>
            <div style={{fontSize:38,fontWeight:900,color:G}}>{mTotal}</div>
            <div style={{fontSize:14,color:G+"77",marginTop:4}}>{t.currency}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {days.map(([dk,slots])=>{
              const earned=Object.values(slots).filter(s=>s.status==="played"&&!s.subId).reduce((a,s)=>a+(s.price||0),0);
              const count=Object.values(slots).filter(s=>s.status==="played"&&!s.subId).length;
              const d=new Date(dk+"T12:00:00");
              return(<div key={dk} style={{background:CARD,borderRadius:14,padding:"13px 15px",border:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontWeight:800,fontSize:14}}>{d.toLocaleDateString(localeStr,{weekday:"short",day:"numeric",month:"short"})}</div><div style={{fontSize:11,color:"#444",marginTop:2}}>{count} {t.sessions}</div></div>
                <div style={{fontSize:18,fontWeight:900,color:G}}>{earned} <span style={{fontSize:11,color:"#444"}}>{t.currency}</span></div>
              </div>);
            })}
          </div>
        </div>
      );
    }

    if(monthDetailSubs){
      const {year:my,month:mm,payments:monthPayments}=monthDetailSubs;
      const byDay=monthPayments.reduce((map,p)=>{if(!map[p.date])map[p.date]=[];map[p.date].push(p);return map;},{});
      const mTotal=monthPayments.reduce((a,p)=>a+(Number(p.amount)||0),0);
      return(
        <div style={{padding:"16px 14px 120px"}}>
          <button onClick={()=>setMonthDetailSubs(null)} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"8px 16px",color:"#888",fontWeight:700,fontSize:13,marginBottom:16}}>←</button>
          <div style={{background:"linear-gradient(135deg,#0b1a28,#0e2240)",borderRadius:18,padding:"20px 18px",border:"1px solid #00b8ff44",marginBottom:16}}>
            <div style={{fontSize:12,color:"#00b8ff99",fontWeight:700,marginBottom:4}}>{new Date(my,mm,1).toLocaleDateString(localeStr,{month:"long",year:"numeric"}).toUpperCase()}</div>
            <div style={{fontSize:38,fontWeight:900,color:"#00b8ff"}}>{mTotal}</div>
            <div style={{fontSize:14,color:"#00b8ff77",marginTop:4}}>{t.currency}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {Object.entries(byDay).sort(([a],[b])=>b.localeCompare(a)).map(([dk,pays])=>{
              const d=new Date(dk+"T12:00:00");
              const dayTotal=pays.reduce((a,p)=>a+(Number(p.amount)||0),0);
              return(<div key={dk} style={{background:CARD,borderRadius:14,padding:"13px 15px",border:`1px solid ${BORDER}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <div style={{fontWeight:800,fontSize:14}}>{d.toLocaleDateString(localeStr,{weekday:"short",day:"numeric",month:"short"})}</div>
                  <div style={{fontSize:16,fontWeight:900,color:"#00b8ff"}}>{dayTotal} <span style={{fontSize:11,color:"#444"}}>{t.currency}</span></div>
                </div>
                {pays.map((p,i)=><div key={i} style={{fontSize:11,color:"#555",marginTop:2}}>• {p.subName}: {p.amount} {t.currency}</div>)}
              </div>);
            })}
          </div>
        </div>
      );
    }

    if(monthDetailTotal){
      const {year:my,month:mm}=monthDetailTotal;
      const matchDays=Object.entries(bookings).filter(([dk])=>{const d=new Date(dk+"T12:00:00");return d.getFullYear()===my&&d.getMonth()===mm&&Object.values(bookings[dk]).some(s=>s.status==="played"&&!s.subId);});
      const subPays=subsData.flatMap(s=>s.payments.filter(p=>{const d=new Date(p.date+"T12:00:00");return d.getFullYear()===my&&d.getMonth()===mm;}).map(p=>({...p,subName:s.name})));
      const allDates=[...new Set([...matchDays.map(([dk])=>dk),...subPays.map(p=>p.date)])].sort((a,b)=>b.localeCompare(a));
      const mMatchTotal=matchDays.reduce((s,[,sl])=>s+Object.values(sl).filter(x=>x.status==="played"&&!x.subId).reduce((a,x)=>a+(x.price||0),0),0);
      const mSubTotal=subPays.reduce((a,p)=>a+(Number(p.amount)||0),0);
      return(
        <div style={{padding:"16px 14px 120px"}}>
          <button onClick={()=>setMonthDetailTotal(null)} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"8px 16px",color:"#888",fontWeight:700,fontSize:13,marginBottom:16}}>←</button>
          <div style={{background:CARD,borderRadius:18,padding:"20px 18px",border:`1px solid ${BORDER}`,marginBottom:16}}>
            <div style={{fontSize:12,color:"#aaa",fontWeight:700,marginBottom:4}}>{new Date(my,mm,1).toLocaleDateString(localeStr,{month:"long",year:"numeric"}).toUpperCase()}</div>
            <div style={{fontSize:38,fontWeight:900,color:"#fff"}}>{mMatchTotal+mSubTotal}</div>
            <div style={{fontSize:14,color:"#444",marginTop:4}}>{t.currency}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {allDates.map(dk=>{
              const d=new Date(dk+"T12:00:00");
              const mEarned=bookings[dk]?Object.values(bookings[dk]).filter(s=>s.status==="played"&&!s.subId).reduce((a,s)=>a+(s.price||0),0):0;
              const mCount=bookings[dk]?Object.values(bookings[dk]).filter(s=>s.status==="played"&&!s.subId).length:0;
              const sPays=subPays.filter(p=>p.date===dk);
              const sTotal=sPays.reduce((a,p)=>a+(Number(p.amount)||0),0);
              return(<div key={dk} style={{background:CARD,borderRadius:14,padding:"13px 15px",border:`1px solid ${BORDER}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <div style={{fontWeight:800,fontSize:14}}>{d.toLocaleDateString(localeStr,{weekday:"short",day:"numeric",month:"short"})}</div>
                  <div style={{fontSize:16,fontWeight:900,color:"#fff"}}>{mEarned+sTotal} <span style={{fontSize:11,color:"#444"}}>{t.currency}</span></div>
                </div>
                {mCount>0&&<div style={{fontSize:11,color:G+"aa",marginTop:2}}>⚽ {mCount} {t.sessions}: {mEarned} {t.currency}</div>}
                {sPays.map((p,i)=><div key={i} style={{fontSize:11,color:"#00b8ffaa",marginTop:2}}>📋 {p.subName}: {p.amount} {t.currency}</div>)}
              </div>);
            })}
          </div>
        </div>
      );
    }

    // ── MAIN VIEW ──
    const mainTabs=[
      ["matches",lang==="ar"?"المباريات":lang==="fr"?"Matchs":"Matches"],
      ["subs",lang==="ar"?"الاشتراكات":lang==="fr"?"Abonnements":"Subs"],
      ["total","Total"],
    ];

    return(
      <div style={{padding:"16px 14px 120px"}}>
        {/* 3 main tabs */}
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          {mainTabs.map(([v,l])=>(
            <button key={v} onClick={()=>{setEarnMainTab(v);setEarnSubTab2("month");}} style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",fontWeight:800,fontSize:12,background:earnMainTab===v?G:CARD,color:earnMainTab===v?"#001a0e":"#555"}}>{l}</button>
          ))}

        {/* This Month / All Months sub tabs */}
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["month",t.thisMonth],["all",t.allMonths]].map(([v,l])=>(
            <button key={v} onClick={()=>setEarnSubTab2(v)} style={{flex:1,padding:"8px 0",borderRadius:10,border:"none",fontWeight:800,fontSize:12,background:earnSubTab2===v?"#1c2030":BG,color:earnSubTab2===v?"#fff":"#444",borderBottom:earnSubTab2===v?`2px solid ${G}`:"2px solid transparent"}}>{l}</button>
          ))}
        </div>

        {/* ── MATCHES TAB ── */}
        {earnMainTab==="matches"&&earnSubTab2==="month"&&(<>
          {statCard(t.todayEarnings,matchTodayE,G,"linear-gradient(135deg,#0b2018,#0e2a1e)",G+"44")}
          {statCard(t.monthEarnings,matchMonthE,"#00b8ff","#0e1a28","#00b8ff44")}
          {statCard(t.totalEarnings,matchAllE,"#fff",CARD,BORDER)}
          <div style={{fontSize:11,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:12}}>{t.history}</div>
          {matchCurMonthDays.length===0?<div style={{textAlign:"center",color:"#333",padding:"30px 0"}}>—</div>:(

                    removedDays.forEach(day=>{
                      const dk=`${activeSub.year}-${String(activeSub.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                      if(nb[dk]&&nb[dk][activeSub.hour]&&nb[dk][activeSub.hour].subId===activeSub.id){
                        const dateCopy={...nb[dk]};
                        delete dateCopy[activeSub.hour];
                        if(Object.keys(dateCopy).length===0){
                          const nbCopy={...nb};
                          delete nbCopy[dk];
                          nb=nbCopy;
                        } else {
                          nb={...nb,[dk]:dateCopy};
                        }
                      }
                      const fieldPath=`data.${dk}.${activeSub.hour}`;
db.collection("bookings").doc(uid).update({
                        [fieldPath]: firebase.firestore.FieldValue.delete()
                      }).then(()=>{
                        if(!nb[dk]||Object.keys(nb[dk]).length===0){
                          db.collection("bookings").doc(uid).update({
                            [`data.${dk}`]: firebase.firestore.FieldValue.delete()
                          }).catch(()=>{});
                        }
                      }).catch(()=>{});
                    });
                    saveBookings(nb);
                  }
                  setSubForm(newData);
                }} t={t} lang={lang} bookedDays={getBookedDaysForHour(subForm.hour,subForm.month,subForm.year,activeSub?.id)} playedDays={getPlayedDaysForSub(activeSub)} key="edit-sub-form"/>

                      let nb={...bookings};
                      for(const day of removedDays){
                        const dk=`${activeSub.year}-${String(activeSub.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                        nb={...nb,[dk]:{...(nb[dk]||{}),[activeSub.hour]:{name:activeSub.name,phone:activeSub.phone,price:0,status:"reserved",subId:activeSub.id}}};
                      }
                      await saveBookings(nb);

                    setSubModal(null);

                    const updated={...activeSub,...subForm,totalPrice:Number(subForm.totalPrice)};

                    bookSubDays(updated,activeSub);
                    setSubModal(null);
                  }} style={{flex:2,background:G,color:"#001a0e",border:"none",borderRadius:12,padding:14,fontWeight:900,fontSize:15}}>{t.save}</button>
                </div>
              </div>
            </div>

              <div style={{background:CARD,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:360,border:"1px solid #2e1414",animation:"popIn 0.2s ease"}}>
                <div style={{fontSize:32,textAlign:"center",marginBottom:14}}>⚠️</div>
                <div style={{fontWeight:900,fontSize:16,color:"#fff",textAlign:"center",marginBottom:8}}>{t.subDelConfirm}</div>
                <div style={{fontSize:13,color:"#ff5555",textAlign:"center",marginBottom:24}}>{activeSub.name}</div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setSubModal(null)} style={{flex:1,background:"#1c2030",color:"#888",border:"none",borderRadius:12,padding:"13px",fontWeight:700,fontSize:14}}>{t.cancel}</button>
                  <button onClick={async()=>{
                    let nb={...bookings};
                    Object.keys(nb).forEach(dk=>{
                      Object.keys(nb[dk]||{}).forEach(h=>{
                        if(nb[dk][h]&&nb[dk][h].subId===activeSubId){
                          const dateCopy={...nb[dk]};
                          delete dateCopy[h];
                          if(Object.keys(dateCopy).length===0){
                            const nbCopy={...nb};
                            delete nbCopy[dk];
                            nb=nbCopy;
                          } else {
                            nb={...nb,[dk]:dateCopy};
                          }
db.collection("bookings").doc(uid).update({
                            [`data.${dk}.${h}`]: firebase.firestore.FieldValue.delete()
                          }).then(()=>{
                            if(!nb[dk]||Object.keys(nb[dk]).length===0){
                              db.collection("bookings").doc(uid).update({
                                [`data.${dk}`]: firebase.firestore.FieldValue.delete()
                              }).catch(()=>{});
                            }
                          }).catch(()=>{});
                        }
                      });
                    });
                    await saveBookings(nb);

              </div>
            </div>

    const activeSubs=subsData.filter(s=>!s.archived);

            return(
              <button key={s.id} onClick={()=>{setActiveSubId(s.id);setSubsView("detail");}}

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontWeight:900,fontSize:15,color:"#fff",marginBottom:2}}>{s.name}</div>
                    <div style={{fontSize:11,color:"#444"}}>{fmt24(s.hour)} · {MONTHS_NAMES[lang][s.month]} {s.year}</div>

                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:16,fontWeight:900,color:G}}>{s.totalPrice} <span style={{fontSize:11,color:"#444"}}>{t.currency}</span></div>
                    <div style={{fontSize:11,marginTop:2,color:remaining>0?"#ff9955":G,fontWeight:700}}>{remaining>0?`${remaining} ${t.currency} ${t.subRemaining}`:remaining===0?"✓ "+t.subPaid:""}</div>

                  <div style={{background:`linear-gradient(90deg,${G},#00a86b)`,height:"100%",width:`${pct}%`,borderRadius:6}}/>

            <div style={{background:CARD,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:360,border:`1px solid ${G}44`,animation:"popIn 0.2s ease"}}>
              <div style={{fontSize:30,textAlign:"center",marginBottom:12}}>✅</div>
              <div style={{fontWeight:900,fontSize:16,color:"#fff",textAlign:"center",marginBottom:8}}>{lang==="ar"?"تأكيد اللعب":lang==="fr"?"Confirmer Joué":"Confirm Played"}</div>

              </div>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

function r_toKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function r_fmt24(h){return `${String(h).padStart(2,"0")}:00`;}
function r_fmtDate(dk,lang){const d=new Date(dk+"T12:00:00");const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";return d.toLocaleDateString(locale,{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function r_fmtShort(dk,lang){const d=new Date(dk+"T12:00:00");const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";return d.toLocaleDateString(locale,{weekday:"short",day:"numeric",month:"short"});}
function r_fmtMonthYear(y,m,lang){return new Date(y,m,1).toLocaleDateString(lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB",{month:"long",year:"numeric"});}

function r_openPrint(htmlContent,filename){
  const full='<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+filename+'</title>'+
    '<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:#fff;color:#111;padding:20px;}table{width:100%;border-collapse:collapse;font-size:11px;}th{padding:7px 8px;font-size:8px;font-weight:800;color:#888;background:#f5f5f5;}td{padding:6px 8px;border-bottom:1px solid #f0f0f0;}tr:nth-child(even) td{background:#fafafa;}@media print{@page{margin:10mm;}body{print-color-adjust:exact;-webkit-print-color-adjust:exact;}}</style>'+
    '</head><body>'+htmlContent+'</body></html>';
  // Use base64 data URI — works in Safari, PWA standalone, and all browsers without opening a new tab or navigating away
  const b64=btoa(unescape(encodeURIComponent(full)));
  const a=document.createElement("a");
  a.href="data:text/html;base64,"+b64;
  a.download=filename+".html";
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>document.body.removeChild(a),500);
}

// ── REPORTS: Planning Tab ─────────────────────────────────────────
function R_PlanningTab({bookings,lang,t,stadiumName}){
  const today=r_toKey(new Date());
  const [from,setFrom]=useState(today);
  const [to,setTo]=useState(today);

  const rows=useMemo(()=>{
    const arr=[];
    Object.entries(bookings).forEach(([dk,slots])=>{
      if(dk<from||dk>to)return;
      Object.entries(slots).forEach(([h,slot])=>{
        if(!slot)return;
        arr.push({dk,hour:Number(h),...slot});
      });
    });
    return arr.sort((a,b)=>a.dk!==b.dk?a.dk.localeCompare(b.dk):a.hour-b.hour);
  },[bookings,from,to]);

  const earned=rows.filter(r=>r.status==="played"&&!r.subId).reduce((a,r)=>a+(r.price||0),0);
  const played=rows.filter(r=>r.status==="played").length;
  const reserved=rows.filter(r=>r.status==="reserved").length;

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";
    const period=from===to?r_fmtDate(from,lang):`${r_fmtDate(from,lang)} → ${r_fmtDate(to,lang)}`;
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportPlanning}</div>
        <div style="font-size:10px;color:#aaa;margin-top:1px;">${period}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        <div style="border:1.5px solid #00D48A22;border-radius:8px;padding:10px;text-align:center;background:#00D48A08;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalEarnings.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00D48A;">${earned.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
        <div style="border:1.5px solid #4a90d922;border-radius:8px;padding:10px;text-align:center;background:#4a90d908;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalPlayed.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#4a90d9;">${played}</div>
          <div style="font-size:8px;color:#aaa;">${t.matches}</div>
        </div>
        <div style="border:1.5px solid #d4a01722;border-radius:8px;padding:10px;text-align:center;background:#d4a01708;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalReserved.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#d4a017;">${reserved}</div>
          <div style="font-size:8px;color:#aaa;">${t.matches}</div>
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"التاريخ":"DATE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.hours.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":"CLIENT"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الهاتف":lang==="fr"?"TÉL":"PHONE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.currency}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الحالة":lang==="fr"?"STATUT":"STATUS"}</th>
        </tr></thead>
        <tbody>
          ${rows.map((r,i)=>{
            const isP=r.status==="played";const isSub=!!r.subId;
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#888;">${r_fmtShort(r.dk,lang)}</td>
              <td style="padding:6px 8px;color:#4a90d9;font-weight:700;">${r_fmt24(r.hour)}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${r.name||"—"}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#aaa;">${r.phone||"—"}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:800;color:#00D48A;">${isSub?"—":`${r.price||0} ${t.currency}`}</td>

      </div>
    </div>`;
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      <div style={{background:CARD,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
        <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>{t.pickRange.toUpperCase()}</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:8,color:"#444",fontWeight:700,marginBottom:4}}>{t.from.toUpperCase()}</div>
            <input type="date" value={from} onChange={e=>{setFrom(e.target.value);if(e.target.value>to)setTo(e.target.value);}}
              style={{width:"100%",background:BG,border:`1.5px solid ${BORDER}`,borderRadius:8,padding:"9px 10px",color:"#fff",fontSize:13,fontWeight:700}}

          </div>
          <div style={{color:"#333",paddingTop:16,fontSize:16}}>→</div>
          <div style={{flex:1}}>
            <div style={{fontSize:8,color:"#444",fontWeight:700,marginBottom:4}}>{t.to.toUpperCase()}</div>

        </div>
        {from&&<div style={{fontSize:10,color:"#444",marginTop:6,fontWeight:600}}>{from===to?r_fmtDate(from,lang):`${r_fmtShort(from,lang)} → ${r_fmtShort(to,lang)}`}</div>}

          <R_StatCard label={t.totalPlayed} val={played} unit={t.matches} color="#7eb8ff" bg="#0a0e1f"/>
          <R_StatCard label={t.totalReserved} val={reserved} unit={t.matches} color="#ffd700" bg="#1a1400"/>
        </div>
      )}
      {rows.length===0?(<R_Empty text={t.noMatches}/>):(
        <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>
            {t.tabPlanning.toUpperCase()} · {rows.length} {t.matches.toUpperCase()}
          </div>
          {rows.map((r,i)=>{
            const isPlayed=r.status==="played";const isSub=!!r.subId;
            const hd=r.hour===0?12:r.hour>12?r.hour-12:r.hour;
            return(
              <div key={i} style={{padding:"11px 14px",borderBottom:i<rows.length-1?`1px solid ${BORDER}22`:"none",display:"flex",alignItems:"center",gap:8}}>

// ── REPORTS: Earnings Tab ─────────────────────────────────────────
function R_EarningsTab({bookings,subs,lang,t,stadiumName}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";

  const daysData=useMemo(()=>{
    const map={};
    Object.entries(bookings).forEach(([dk,slots])=>{
      const d=new Date(dk+"T12:00:00");
      if(d.getFullYear()!==year||d.getMonth()!==month)return;
      const matchE=Object.values(slots).filter(s=>s&&s.status==="played"&&!s.subId).reduce((a,s)=>a+(s.price||0),0);
      const matchCount=Object.values(slots).filter(s=>s&&s.status==="played").length;
      if(matchE>0||matchCount>0){
        if(!map[dk])map[dk]={matchE:0,subE:0,matchCount:0,subPays:[]};
        map[dk].matchE+=matchE;map[dk].matchCount+=matchCount;
      }
    });
    subs.forEach(s=>{
      (s.payments||[]).forEach(p=>{
        if(!p.date)return;
        const d=new Date(p.date+"T12:00:00");
        if(d.getFullYear()!==year||d.getMonth()!==month)return;
        if(!map[p.date])map[p.date]={matchE:0,subE:0,matchCount:0,subPays:[]};
        map[p.date].subE+=(p.amount||0);
        map[p.date].subPays.push({name:s.name,amount:p.amount});
      });
    });
    return Object.entries(map).sort(([a],[b])=>a.localeCompare(b));
  },[bookings,subs,year,month]);

  const totalMatchE=daysData.reduce((a,[,d])=>a+d.matchE,0);
  const totalSubE=daysData.reduce((a,[,d])=>a+d.subE,0);
  const total=totalMatchE+totalSubE;
  const mLabel=r_fmtMonthYear(year,month,lang);

  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">

      </div>
      <div style="background:linear-gradient(135deg,#f0fdf8,#e6f9f2);border:2px solid #00D48A33;border-radius:12px;padding:14px;margin-bottom:12px;text-align:center;">
        <div style="font-size:9px;color:#00a86b;font-weight:700;margin-bottom:4px;">${t.totalMonth.toUpperCase()} — ${mLabel}</div>
        <div style="font-size:36px;font-weight:900;color:#00a86b;line-height:1;">${total.toLocaleString()}</div>
        <div style="font-size:11px;color:#00a86b88;margin-top:3px;">${t.currency}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <div style="border:1.5px solid #00b8ff22;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.subEarn.toUpperCase()}</div>

        <div style="border:1.5px solid #00D48A22;border-radius:8px;padding:10px;text-align:center;">

          <div style="font-size:20px;font-weight:900;color:#00a86b;">${totalMatchE.toLocaleString()}</div>

        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"التاريخ":"DATE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.matchEarn.toUpperCase()}</th>

        </tr></thead>
        <tbody>
          ${daysData.map(([dk,d],i)=>`<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${r_fmtShort(dk,lang)}</td>

            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:900;">${(d.matchE+d.subE).toLocaleString()} ${t.currency}</td>
          </tr>`).join("")}
          <tr style="background:#f0fdf8;border-top:2px solid #00D48A;">
            <td style="padding:8px;text-align:${isRTL?"right":"left"};font-weight:900;">${lang==="ar"?"الإجمالي":"TOTAL"}</td>

            <td style="padding:8px;text-align:${isRTL?"right":"left"};font-weight:900;font-size:14px;">${total.toLocaleString()} ${t.currency}</td>
          </tr>
