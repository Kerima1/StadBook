// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState("fr");
  const [authUser,setAuthUser]=useState(undefined);
  const [userDoc,setUserDoc]=useState(null);
  const [contactInfo,setContactInfo]=useState({whatsapp:"",messages:{fr:"Besoin d'accès ? Contactez-nous sur WhatsApp.",en:"Need access? Contact us on WhatsApp.",ar:"تريد الوصول؟ تواصل معنا على واتساب."}});

  useEffect(()=>{
    // Load contact info - works before and after login
    const unsub=db.collection("settings").doc("contact").onSnapshot(snap=>{
      if(snap.exists) setContactInfo(snap.data());
    },err=>{
      db.collection("settings").doc("contact").get().then(s=>{ if(s.exists) setContactInfo(s.data()); }).catch(()=>{});
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async u=>{
      if(u){
        setAuthUser(u);
        if(u.email===ADMIN_EMAIL){ setUserDoc({isAdmin:true}); return; }
        // Listen to user doc in real time
        const docUnsub=db.collection("users").doc(u.uid).onSnapshot(snap=>{
          setUserDoc(snap.exists?{id:snap.id,...snap.data()}:null);
        });
        return docUnsub;
      } else {
        setAuthUser(null);
        setUserDoc(null);
      }
    });
    return unsub;
  },[]);

  if(authUser===undefined) return(
    <div style={{background:BG,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:40,height:40,border:`3px solid ${G}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{color:G,fontSize:16,fontWeight:800}}>StadBook</div>
    </div>
  );

  if(!authUser) return <AuthScreen lang={lang} setLang={setLang} contactInfo={contactInfo}/>;
  if(authUser.email===ADMIN_EMAIL) return <AdminPanel lang={lang} setLang={setLang} contactInfo={contactInfo} setContactInfo={setContactInfo}/>;
  if(!userDoc||!userDoc.active) return <PendingScreen lang={lang} setLang={setLang} contactInfo={contactInfo}/>;
  return <StadBookApp lang={lang} setLang={setLang} user={userDoc} uid={authUser.uid}/>;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function AuthScreen({lang,setLang,contactInfo}){
  const t=T[lang],isRTL=lang==="ar";
  const [mode,setMode]=useState("login"); // login | signup | forgot
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [stadiumName,setStadiumName]=useState("");
  const [showPass,setShowPass]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  const [loading,setLoading]=useState(false);
  const [pulse,setPulse]=useState(false);
  useEffect(()=>{const iv=setInterval(()=>setPulse(p=>!p),1800);return()=>clearInterval(iv);},[]);
  const gc=pulse?"#00D48A":"#007a50";
  const message=(contactInfo&&contactInfo.messages)?contactInfo.messages[lang]||contactInfo.messages.fr||contactInfo.messages.en||contactInfo.messages.ar||"": "";

  const handleAuth=async()=>{
    setError("");setSuccess("");
    if(!email.includes("@")) return setError(t.errorEmail);
    if(mode==="signup"&&!stadiumName.trim()) return setError(t.errorName);
    if(password.length<6) return setError(t.errorPassword);
    setLoading(true);
    try{
      if(mode==="login"){
        await auth.signInWithEmailAndPassword(email,password);
      } else {
        const cred=await auth.createUserWithEmailAndPassword(email,password);
        // Clean up any old data for this uid just in case
        await db.collection("bookings").doc(cred.user.uid).delete().catch(()=>{});
        await db.collection("users").doc(cred.user.uid).set({
          email:email.toLowerCase().trim(),
          stadiumName:stadiumName.trim(),
          active:false,
          createdAt:new Date().toISOString(),
          price:500,
        });
      }
    } catch(e){
      if(e.code==="auth/wrong-password"||e.code==="auth/user-not-found"||e.code==="auth/invalid-credential") setError(t.errorWrong);
      else if(e.code==="auth/email-already-in-use") setError(t.errorExists);
      else setError(t.errorGeneral);
    }
    setLoading(false);
  };

  const handleForgot=()=>{
    setMode("forgot");
    setError("");setSuccess("");
  };

  const inp={width:"100%",background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:"13px 15px",color:"#fff",fontSize:15,transition:"border-color 0.1s"};

  return(
    <div style={{fontFamily:isRTL?"'Cairo',sans-serif":"'Nunito',sans-serif",direction:isRTL?"rtl":"ltr",background:BG,minHeight:"100vh",overflowY:"auto",paddingBottom:40}}>

            <span style={{fontSize:18}}>{FLAGS[l]}</span>{LANG_LABELS[l]}
          </button>
        ))}
      </div>

      {/* Guide + contact ABOVE logo */}
      <div style={{margin:"20px 16px 0",background:CARD,borderRadius:16,padding:"16px",border:`1.5px solid ${gc}44`,transition:"border-color 1.8s"}}>
        {[t.guideStep1,t.guideStep2,t.guideStep3].map((step,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:i<2?10:0}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:gc+"22",border:`2px solid ${gc}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:gc,flexShrink:0}}>{i+1}</div>
            <div style={{fontSize:13,fontWeight:700,color:gc}}>{step}</div>
          </div>
        ))}
      </div>
      <div style={{margin:"12px 16px 0",background:`linear-gradient(135deg,${gc}15,${gc}08)`,borderRadius:16,padding:"14px 16px",border:`1.5px solid ${gc}55`,animation:"pulse 3s ease infinite"}}>
        <div style={{fontSize:11,color:gc,fontWeight:800,marginBottom:6}}>📞 {t.contactCard}</div>
        <div style={{fontSize:15,fontWeight:900,color:"#fff"}}>WhatsApp: {contactInfo.whatsapp||t.noPhone}</div>
        <div style={{fontSize:12,color:"#666",marginTop:4}}>{lang==="ar"?"تواصل معنا على واتساب لتفعيل حسابك.":lang==="fr"?"Contactez-nous sur WhatsApp pour activer votre compte.":"Contact us on WhatsApp to activate your account."}</div>

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function StadBookApp({lang,setLang,user,uid}){
  const [tab,setTab]=useState("home");
  const [price,setPrice]=useState(user?.price||500);
  const [stadiumName,setStadiumName]=useState(user?.stadiumName||"Mon Terrain");
  const [editingPrice,setEditingPrice]=useState(false);
  const [editingName,setEditingName]=useState(false);
  const [tempPrice,setTempPrice]=useState(price);
  const [tempName,setTempName]=useState(stadiumName);
  const [bookings,setBookings]=useState({});
  const [selectedDate,setSelectedDate]=useState(new Date());
  const [calView,setCalView]=useState("day");
  const [modal,setModal]=useState(null);
  const [bookName,setBookName]=useState("");
  const [bookPhone,setBookPhone]=useState("");

  const t=T[lang],isRTL=lang==="ar";
  const todayKey=toKey(new Date());
  const dateKey=toKey(selectedDate);
  const localeStr=lang==="ar"?"ar-EG":lang==="fr"?"fr-FR":"en-US";

  // Sync user doc changes (price, stadiumName)
  useEffect(()=>{
    if(user?.price) setPrice(user.price);
    if(user?.stadiumName) setStadiumName(user.stadiumName);
  },[user]);

  // Real-time bookings
  useEffect(()=>{
    if(!uid) return;
    const unsub=db.collection("bookings").doc(uid).onSnapshot(snap=>{
      setBookings(snap.exists?(snap.data().data||{}):{});
    });
    return unsub;
  },[uid]);

  const saveBookings=useCallback(async(nb)=>{
    setBookings(nb);
    await db.collection("bookings").doc(uid).set({data:nb},{merge:true});
  },[uid]);

  const saveSettings=async(np,nn)=>{
    await db.collection("users").doc(uid).update({price:np,stadiumName:nn});
  };

  const getSlot=(dk,h)=>bookings[dk]?.[h];
  const daySlots=bookings[dateKey]||{};

  const todayEarnings=useMemo(()=>Object.values(bookings[todayKey]||{}).filter(s=>s.status==="played").length*price,[bookings,todayKey,price]);
  const monthBookings=useMemo(()=>{
    const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
    let c=0;
    for(const dk of Object.keys(bookings)){const d=new Date(dk+"T12:00:00");if(d.getFullYear()===yr&&d.getMonth()===mo)c+=Object.keys(bookings[dk]).length;}
    return c;
  },[bookings]);

  const countFor=(dk,status=null)=>{const s=bookings[dk]||{};if(!status)return Object.keys(s).length;return Object.values(s).filter(x=>x.status===status).length;};

  const confirmBook=async()=>{
    if(!bookName.trim()||!bookPhone.trim()) return;
    const nb={...bookings,[dateKey]:{...(bookings[dateKey]||{}),[modal]:{name:bookName.trim(),phone:bookPhone.trim(),status:"reserved"}}};
    await saveBookings(nb);
    setBookName("");setBookPhone("");setModal(null);
  };

  const cancelSlot=async(dk,h)=>{const day={...(bookings[dk]||{})};delete day[h];await saveBookings({...bookings,[dk]:day});};
  const playSlot=async(dk,h)=>await saveBookings({...bookings,[dk]:{...(bookings[dk]||{}),[h]:{...bookings[dk][h],status:"played"}}});
  const goToDay=d=>{setSelectedDate(new Date(d));setCalView("day");setTab("schedule");};

  const NAV=[{id:"home",icon:<HomeIcon/>,label:t.home},{id:"schedule",icon:<CalIcon/>,label:t.schedule},{id:"earnings",icon:<EarnIcon/>,label:t.earnings},{id:"settings",icon:<SettIcon/>,label:t.settings}];

  const SlotCard=({h,dk})=>{
    const slot=getSlot(dk,h),isPlayed=slot?.status==="played",isReserved=slot?.status==="reserved";
    const isPast=!slot&&toKey(new Date(dk+"T12:00:00"))<todayKey;
    return(
      <div style={{background:isPlayed?"#071510":isReserved?"#0b1a13":CARD,border:`1.5px solid ${isPlayed?G+"44":isReserved?G+"66":BORDER}`,borderRadius:14,padding:"11px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",opacity:isPast?0.3:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{minWidth:46,height:46,borderRadius:11,flexShrink:0,background:isPlayed?G+"22":isReserved?G:"#161b28",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:14,fontWeight:900,lineHeight:1.1,color:isReserved&&!isPlayed?"#001a0e":isPlayed?G:"#333"}}>{h===0?12:h>12?h-12:h}</span>
            <span style={{fontSize:8,fontWeight:700,color:isReserved&&!isPlayed?"#003a20":isPlayed?G+"99":"#222"}}>{h>=12?"PM":"AM"}</span>
          </div>
          <div>
            {slot?(<>
              <div style={{fontWeight:800,fontSize:14,color:isPlayed?"#666":"#fff"}}>{slot.name}</div>
              {slot.phone&&<div style={{fontSize:11,color:"#444",marginTop:1}}>📞 {slot.phone}</div>}
              <div style={{fontSize:11,marginTop:1,color:isPlayed?G+"88":G+"99",fontWeight:700}}>{isPlayed?`✓ ${t.played}`:`● ${t.booked}`} · {price} {t.currency}</div>
            </>):(<div style={{color:"#2a2f45",fontSize:12,fontWeight:600}}>{fmt24(h)}</div>)}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {isPlayed?<Check size={28} color={G}/>
          :isReserved?(<>
            <button onClick={()=>cancelSlot(dk,h)} style={{background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:8,padding:"6px 10px",fontWeight:700,fontSize:11}}>{t.cancel}</button>
            <button onClick={()=>playSlot(dk,h)} style={{background:G,color:G_DARK,border:"none",borderRadius:8,padding:"6px 10px",fontWeight:900,fontSize:11,display:"flex",alignItems:"center",gap:4}}>
              <svg width="10" height="10" viewBox="0 0 12 12" fill={G_DARK}><polygon points="2,1 11,6 2,11"/></svg>{t.play}
            </button>
          </>)
          :<button onClick={()=>{setSelectedDate(new Date(dk+"T12:00:00"));setModal(h);}} style={{background:G,color:"#001a0e",border:"none",borderRadius:8,padding:"7px 13px",fontWeight:900,fontSize:12}}>{t.book}</button>}
        </div>
      </div>
    );
  };

  const HomeTab=()=>{
    const ts=bookings[todayKey]||{};
    const played=Object.values(ts).filter(s=>s.status==="played").length;
    const reserved=Object.values(ts).filter(s=>s.status==="reserved").length;
    return(
      <div style={{padding:"16px 14px"}}>
        <div style={{marginBottom:16,padding:"14px 16px",background:CARD,borderRadius:16,border:`1px solid ${BORDER}`}}>
          <div style={{fontSize:11,color:"#444",fontWeight:700,marginBottom:4}}>⚽ {t.stadium}</div>
          <div style={{fontSize:22,fontWeight:900,color:G}}>{stadiumName}</div>
          <div style={{fontSize:12,color:"#444",marginTop:2}}>{new Date().toLocaleDateString(localeStr,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {[
            {label:t.todayEarnings,value:todayEarnings,unit:t.currency,color:G,bg:"#0b2018"},
            {label:t.totalPlayed,value:played,unit:t.sessions,color:"#fff",bg:CARD},
            {label:t.totalReserved,value:reserved,unit:t.sessions,color:"#aaa",bg:CARD},
            {label:t.monthBookings,value:monthBookings,unit:t.bookings,color:G,bg:CARD},
          ].map((s,i)=>(
            <div key={i} style={{background:s.bg,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
              <div style={{fontSize:9,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:6}}>{s.label.toUpperCase()}</div>
              <div style={{fontSize:22,fontWeight:900,color:s.color}}>{s.value}</div>
              {s.unit&&<div style={{fontSize:11,color:"#444",marginTop:2}}>{s.unit}</div>}
            </div>
          ))}
        </div>
        <div style={{fontSize:12,color:"#555",fontWeight:700,marginBottom:10}}>{t.upcomingToday.toUpperCase()}</div>
        {Object.keys(ts).length===0
          ?<div style={{textAlign:"center",color:"#333",padding:"30px 0",fontSize:14}}>{t.noBookings}</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>{Object.entries(ts).sort(([a],[b])=>+a-+b).map(([h])=><SlotCard key={h} h={+h} dk={todayKey}/>)}</div>
        }
      </div>
    );
  };

  const ScheduleTab=()=>{
    const weekStart=startOfWeek(selectedDate);
    const weekDays=Array.from({length:7},(_,i)=>addDays(weekStart,i));
    const monthGrid=getMonthGrid(selectedDate.getFullYear(),selectedDate.getMonth());
    return(
      <div>
        <div style={{display:"flex",gap:8,padding:"12px 14px 0"}}>
          {["day","week","month"].map(v=><button key={v} onClick={()=>setCalView(v)} style={{flex:1,padding:"8px 0",borderRadius:10,border:"none",fontWeight:800,fontSize:13,background:calView===v?G:CARD,color:calView===v?"#001a0e":"#555",transition:"background 0.1s,color 0.1s"}}>{T[lang][v]}</button>)}
        </div>
        {calView==="day"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px 6px"}}>
              <button onClick={()=>setSelectedDate(addDays(selectedDate,-1))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
              <div style={{textAlign:"center"}}>
                <div style={{fontWeight:800,fontSize:14,color:toKey(selectedDate)===todayKey?G:"#fff"}}>{selectedDate.toLocaleDateString(localeStr,{weekday:"long",day:"numeric",month:"long"})}</div>
                <div style={{fontSize:11,color:"#444"}}>{selectedDate.getFullYear()}</div>
              </div>
              <button onClick={()=>setSelectedDate(addDays(selectedDate,1))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
            </div>
            <div style={{padding:"6px 14px 120px",display:"flex",flexDirection:"column",gap:7}}>{HOURS.map(h=><SlotCard key={h} h={h} dk={dateKey}/>)}</div>
          </div>
        )}
        {calView==="week"&&(
          <div style={{padding:"10px 14px 120px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <button onClick={()=>setSelectedDate(addDays(selectedDate,-7))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
              <div style={{fontSize:13,fontWeight:700,color:"#888"}}>{weekStart.toLocaleDateString(localeStr,{day:"numeric",month:"short"})} – {addDays(weekStart,6).toLocaleDateString(localeStr,{day:"numeric",month:"short",year:"numeric"})}</div>
              <button onClick={()=>setSelectedDate(addDays(selectedDate,7))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>{DAYS_SHORT[lang].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:800,color:"#444"}}>{d}</div>)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:20}}>
              {weekDays.map((d,i)=>{const dk=toKey(d),total=countFor(dk),pl=countFor(dk,"played"),isT=dk===todayKey,isSel=dk===dateKey;return(
                <button key={i} onClick={()=>goToDay(d)} style={{background:isSel?G:isT?"#0e2018":CARD,border:`1.5px solid ${isSel?G:isT?G+"44":BORDER}`,borderRadius:12,padding:"10px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <span style={{fontSize:16,fontWeight:900,color:isSel?"#001a0e":isT?G:"#ccc"}}>{d.getDate()}</span>
                  {total>0&&<div style={{display:"flex",flexDirection:"column",gap:2,width:"100%",padding:"0 4px"}}>{pl>0&&<div style={{background:isSel?"#001a0e":G,borderRadius:3,height:4}}/>}{(total-pl)>0&&<div style={{background:isSel?"#002a18":G+"55",borderRadius:3,height:4}}/>}</div>}
                </button>
              );})}
            </div>
            {weekDays.map(d=>{const dk=toKey(d),slots=bookings[dk]||{};if(!Object.keys(slots).length)return null;return(
              <div key={dk} style={{marginBottom:16}}>
                <div style={{fontSize:11,color:"#555",fontWeight:800,marginBottom:8}}>{d.toLocaleDateString(localeStr,{weekday:"long",day:"numeric",month:"long"}).toUpperCase()}</div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>{Object.entries(slots).sort(([a],[b])=>+a-+b).map(([h])=><SlotCard key={h} h={+h} dk={dk}/>)}</div>
              </div>
            );})}
          </div>
        )}
        {calView==="month"&&(
          <div style={{padding:"10px 14px 120px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <button onClick={()=>setSelectedDate(new Date(selectedDate.getFullYear(),selectedDate.getMonth()-1,1))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
              <div style={{fontSize:15,fontWeight:900,color:"#fff"}}>{selectedDate.toLocaleDateString(localeStr,{month:"long",year:"numeric"})}</div>
              <button onClick={()=>setSelectedDate(new Date(selectedDate.getFullYear(),selectedDate.getMonth()+1,1))} style={{background:CARD,border:"none",borderRadius:8,padding:"6px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>{DAYS_SHORT[lang].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:800,color:"#444"}}>{d}</div>)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:20}}>
              {monthGrid.map((d,i)=>{if(!d)return<div key={i}/>;const dk=toKey(d),total=countFor(dk),pl=countFor(dk,"played"),isT=dk===todayKey,isSel=dk===dateKey;return(
                <button key={i} onClick={()=>goToDay(d)} style={{background:isSel?G:isT?"#0e2018":CARD,border:`1.5px solid ${isSel?G:isT?G+"44":BORDER}`,borderRadius:10,padding:"8px 2px",minHeight:52,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <span style={{fontSize:14,fontWeight:900,color:isSel?"#001a0e":isT?G:"#ccc"}}>{d.getDate()}</span>
                  {total>0&&<div style={{display:"flex",gap:2}}>{pl>0&&<div style={{width:5,height:5,borderRadius:"50%",background:isSel?"#001a0e":G}}/>}{(total-pl)>0&&<div style={{width:5,height:5,borderRadius:"50%",background:isSel?"#002a18":G+"66"}}/>}</div>}
                </button>
              );})}
            </div>
            {Object.keys(daySlots).length>0&&(
              <div>
                <div style={{fontSize:11,color:"#555",fontWeight:800,marginBottom:10}}>{selectedDate.toLocaleDateString(localeStr,{weekday:"long",day:"numeric",month:"long"}).toUpperCase()}</div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>{Object.entries(daySlots).sort(([a],[b])=>+a-+b).map(([h])=><SlotCard key={h} h={+h} dk={dateKey}/>)}</div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  const EarningsTab=()=>{
    const total=useMemo(()=>{let s=0;for(const dk of Object.keys(bookings))for(const x of Object.values(bookings[dk]))if(x.status==="played")s+=price;return s;},[]);
    const monthE=useMemo(()=>{const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();let s=0;for(const dk of Object.keys(bookings)){const d=new Date(dk+"T12:00:00");if(d.getFullYear()===yr&&d.getMonth()===mo)for(const x of Object.values(bookings[dk]))if(x.status==="played")s+=price;}return s;},[]);
    const allDays=Object.entries(bookings).filter(([,s])=>Object.values(s).some(x=>x.status==="played")).sort(([a],[b])=>b.localeCompare(a));
    return(
      <div style={{padding:"16px 14px 120px"}}>
        <div style={{background:"linear-gradient(135deg,#0b2018,#0e2a1e)",borderRadius:18,padding:"20px 18px",border:`1px solid ${G}44`,marginBottom:12}}>
          <div style={{fontSize:10,color:G+"99",fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{t.todayEarnings.toUpperCase()}</div>
          <div style={{fontSize:38,fontWeight:900,color:G,lineHeight:1}}>{todayEarnings}</div>
          <div style={{fontSize:14,color:G+"77",marginTop:4}}>{t.currency}</div>
        </div>
        <div style={{background:"#0e1a28",borderRadius:18,padding:"20px 18px",border:"1px solid #00b8ff44",marginBottom:12}}>
          <div style={{fontSize:10,color:"#00b8ff99",fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{t.monthEarnings.toUpperCase()}</div>
          <div style={{fontSize:38,fontWeight:900,color:"#00b8ff",lineHeight:1}}>{monthE}</div>
          <div style={{fontSize:14,color:"#00b8ff77",marginTop:4}}>{t.currency}</div>
        </div>
        <div style={{background:CARD,borderRadius:18,padding:"20px 18px",border:`1px solid ${BORDER}`,marginBottom:20}}>
          <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{t.totalEarnings.toUpperCase()}</div>
          <div style={{fontSize:38,fontWeight:900,color:"#fff",lineHeight:1}}>{total}</div>
          <div style={{fontSize:14,color:"#444",marginTop:4}}>{t.currency}</div>
        </div>
        <div style={{fontSize:11,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:12}}>{t.history}</div>
        {allDays.length===0?<div style={{textAlign:"center",color:"#333",padding:"30px 0"}}>—</div>:(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {allDays.map(([dk,slots])=>{
              const earned=Object.values(slots).filter(s=>s.status==="played").length*price;
              const count=Object.values(slots).filter(s=>s.status==="played").length;
              const d=new Date(dk+"T12:00:00");
              return(<div key={dk} style={{background:CARD,borderRadius:14,padding:"13px 15px",border:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontWeight:800,fontSize:14}}>{d.toLocaleDateString(localeStr,{weekday:"short",day:"numeric",month:"short"})}</div><div style={{fontSize:11,color:"#444",marginTop:2}}>{count} {t.sessions}</div></div>
                <div style={{fontSize:18,fontWeight:900,color:G}}>{earned} <span style={{fontSize:11,color:"#444"}}>{t.currency}</span></div>
              </div>);
            })}
          </div>
        )}
      </div>
    );
  };

  const SettingsTab=()=>(
    <div style={{padding:"16px 14px 120px"}}>
      {/* Stadium name */}
      <div style={{background:CARD,borderRadius:16,padding:"16px",border:`1px solid ${BORDER}`,marginBottom:12}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>{t.stadiumName.toUpperCase()}</div>
        {editingName?(<div style={{display:"flex",gap:8}}>
          <input value={tempName} onChange={e=>setTempName(e.target.value)} autoFocus style={{flex:1,background:BG,border:`2px solid ${G}`,borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:15}}/>
          <button onClick={async()=>{setStadiumName(tempName);setEditingName(false);await saveSettings(price,tempName);}} style={{background:G,color:"#001a0e",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:900,fontSize:13}}>{t.save}</button>
        </div>):(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:18,fontWeight:900,color:G}}>{stadiumName}</span>
          <button onClick={()=>{setTempName(stadiumName);setEditingName(true);}} style={{background:`${G}18`,color:G,border:`1px solid ${G}44`,borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:800}}>✏️ {t.edit}</button>
        </div>)}
      </div>
      {/* Price */}
      <div style={{background:CARD,borderRadius:16,padding:"16px",border:`1px solid ${BORDER}`,marginBottom:12}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>{t.price.toUpperCase()}</div>
        {editingPrice?(<div style={{display:"flex",gap:8}}>
          <input type="number" value={tempPrice} onChange={e=>setTempPrice(Number(e.target.value))} autoFocus style={{flex:1,background:BG,border:`2px solid ${G}`,borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:15}}/>
          <button onClick={async()=>{setPrice(tempPrice);setEditingPrice(false);await saveSettings(tempPrice,stadiumName);}} style={{background:G,color:"#001a0e",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:900,fontSize:13}}>{t.save}</button>
        </div>):(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:18,fontWeight:900,color:G}}>{price} <span style={{fontSize:12,color:"#444"}}>{t.currency}</span></span>
          <button onClick={()=>{setTempPrice(price);setEditingPrice(true);}} style={{background:`${G}18`,color:G,border:`1px solid ${G}44`,borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:800}}>✏️ {t.edit}</button>
        </div>)}
      </div>
      {/* Language */}
      <div style={{background:CARD,borderRadius:16,padding:"16px",border:`1px solid ${BORDER}`,marginBottom:12}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>{t.language.toUpperCase()}</div>
        <div style={{display:"flex",gap:8}}>
          {[["ar","🇲🇷 AR"],["fr","🇫🇷 FR"],["en","🇬🇧 EN"]].map(([l,label])=>(
            <button key={l} onClick={()=>setLang(l)} style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",fontWeight:800,fontSize:13,background:lang===l?G:"#1c2030",color:lang===l?"#001a0e":"#666",transition:"background 0.1s,color 0.1s"}}>{label}</button>
          ))}
        </div>
      </div>
      {/* Change Password */}
      <div style={{background:CARD,borderRadius:16,padding:"16px",border:`1px solid ${BORDER}`,marginBottom:12}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>{lang==="ar"?"تغيير كلمة المرور":lang==="fr"?"MOT DE PASSE":"PASSWORD"}</div>
        <button onClick={async()=>{
          try{
            await auth.sendPasswordResetEmail(auth.currentUser.email);
            alert(lang==="ar"?"تم إرسال بريد إعادة التعيين! تحقق من البريد العشوائي.":lang==="fr"?"Email envoyé ! Vérifiez vos spams.":"Reset email sent! Check your spam folder.");
          } catch(e){ alert("Error: "+e.message); }
        }} style={{width:"100%",background:`${G}18`,color:G,border:`1px solid ${G}44`,borderRadius:12,padding:"13px",fontWeight:900,fontSize:14}}>
          {lang==="ar"?"إرسال رابط إعادة التعيين":lang==="fr"?"Envoyer lien de réinitialisation":"Send Reset Link"}
        </button>
      </div>
      {/* Account */}
      <div style={{background:CARD,borderRadius:16,padding:"16px",border:`1px solid ${BORDER}`}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>{t.account.toUpperCase()}</div>
        <div style={{fontSize:13,color:"#555",marginBottom:14,overflow:"hidden",textOverflow:"ellipsis"}}>{auth.currentUser?.email}</div>
        <button onClick={()=>auth.signOut()} style={{width:"100%",background:"#1a0808",color:"#ff5555",border:"1px solid #2e1414",borderRadius:12,padding:"13px",fontWeight:900,fontSize:14}}>{t.signOut}</button>
      </div>
    </div>
  );

  return(
    <>
      <div style={{fontFamily:isRTL?"'Cairo',sans-serif":"'Nunito',sans-serif",direction:isRTL?"rtl":"ltr",maxWidth:430,margin:"0 auto",minHeight:"100vh",background:BG,color:"#F0F0F0",display:"flex",flexDirection:"column"}}>
        <div style={{background:"#111420",padding:"14px 16px 10px",borderBottom:`1px solid ${BORDER}`,position:"sticky",top:0,zIndex:30}}>
          <div style={{fontSize:18,fontWeight:900,color:G}}>⚽ {t.appName} <span style={{fontSize:12,color:"#444",fontWeight:600}}>· {stadiumName}</span></div>
        </div>
        <div style={{flex:1,overflowY:"auto",paddingBottom:90}}>
          {tab==="home"&&<HomeTab/>}{tab==="schedule"&&<ScheduleTab/>}{tab==="earnings"&&<EarningsTab/>}{tab==="settings"&&<SettingsTab/>}
        </div>
        {/* Bottom nav */}
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,zIndex:30}}>
          <div style={{background:"#0e1019",borderTop:`1px solid ${BORDER}`,display:"flex",paddingBottom:18,paddingTop:6}}>
            {NAV.map(item=>{const isActive=tab===item.id;return(
              <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative",paddingTop:isActive?0:10}}>
                {isActive&&<div style={{position:"absolute",top:-22,width:52,height:52,borderRadius:"50%",background:G,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 20px ${G}66`}}><div style={{color:"#001a0e"}}>{item.icon}</div></div>}
                {!isActive&&<div style={{color:"#444",marginBottom:2}}>{item.icon}</div>}
                <span style={{fontSize:9,fontWeight:800,color:isActive?G:"#444",letterSpacing:0.3,marginTop:isActive?32:0}}>{item.label.toUpperCase()}</span>
              </button>
            );})}
          </div>
        </div>
        {/* Booking modal */}
        {modal!==null&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:99,padding:"20px"}} onClick={()=>{setModal(null);setBookName("");setBookPhone("");}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"#111420",borderRadius:22,padding:"28px 22px",width:"100%",maxWidth:400,border:`1px solid ${BORDER}`,animation:"popIn 0.25s cubic-bezier(.4,0,.2,1) forwards"}}>
              <div style={{fontWeight:900,fontSize:20,marginBottom:4}}>{fmt24(modal)} → {fmt24(modal+1)}</div>
              <div style={{fontSize:12,color:"#555",marginBottom:2}}>{selectedDate.toLocaleDateString(localeStr,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
              <div style={{fontSize:13,color:G,fontWeight:700,marginBottom:22}}>{price} {t.currency}</div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6,letterSpacing:0.5}}>{t.playerName.toUpperCase()}</div>
                <input value={bookName} onChange={e=>setBookName(e.target.value)} autoFocus
                  style={{width:"100%",background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:"13px 15px",color:"#fff",fontSize:15,direction:isRTL?"rtl":"ltr"}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
              </div>
              <div style={{marginBottom:22}}>
                <div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6,letterSpacing:0.5}}>{t.phone.toUpperCase()}</div>
                <input value={bookPhone} onChange={e=>setBookPhone(e.target.value.replace(/\D/g,""))} type="tel"
                  onKeyDown={e=>e.key==="Enter"&&confirmBook()}
                  style={{width:"100%",background:BG,border:`2px solid ${BORDER}`,borderRadius:12,padding:"13px 15px",color:"#fff",fontSize:15}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
                <div style={{fontSize:10,color:"#333",marginTop:4}}>({t.phoneNumbers})</div>
              </div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>{setModal(null);setBookName("");setBookPhone("");}} style={{flex:1,background:"#1c2030",color:"#666",border:"none",borderRadius:12,padding:14,fontWeight:700,fontSize:14}}>{t.cancel}</button>
                <button onClick={confirmBook} disabled={!bookName.trim()||!bookPhone.trim()} style={{flex:2,background:bookName.trim()&&bookPhone.trim()?G:"#0e2018",color:bookName.trim()&&bookPhone.trim()?"#001a0e":"#1a3a28",border:"none",borderRadius:12,padding:14,fontWeight:900,fontSize:15,transition:"background 0.1s"}}>{t.confirm}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
