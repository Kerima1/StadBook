          <div style={{fontSize:10,color:"#00b8ff55"}}>{t.currency}</div>
        </div>
        <div style={{background:"linear-gradient(135deg,#071510,#0b1e14)",borderRadius:14,padding:"13px",border:`1px solid ${G}44`,textAlign:"center"}}>
          <div style={{fontSize:8,color:`${G}88`,fontWeight:700,marginBottom:5}}>{t.matchEarn.toUpperCase()}</div>
          <div style={{fontSize:24,fontWeight:900,color:G}}>{totalMatchE.toLocaleString()}</div>
          <div style={{fontSize:10,color:`${G}55`}}>{t.currency}</div>
        </div>
      </div>
      {daysData.length===0?<R_Empty text={t.noEarnings}/>:(
        <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{t.perDay.toUpperCase()}</div>
          {daysData.map(([dk,d],i)=>(
            <div key={dk} style={{padding:"11px 14px",borderBottom:i<daysData.length-1?`1px solid ${BORDER}22`:"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:d.subPays.length>0?5:0}}>
                <div>
                  <div style={{fontWeight:800,fontSize:13}}>{r_fmtShort(dk,lang)}</div>
                  {d.matchCount>0&&<div style={{fontSize:10,color:"#444",marginTop:1}}>⚽ {d.matchCount} {t.matches}</div>}
                </div>
                <div style={{fontSize:16,fontWeight:900,color:"#fff"}}>{(d.matchE+d.subE).toLocaleString()} <span style={{fontSize:9,color:"#444"}}>{t.currency}</span></div>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:4}}>
                {d.matchE>0&&<R_Tag color={G}>⚽ {d.matchE.toLocaleString()} {t.currency}</R_Tag>}
                {d.subPays.map((p,pi)=><R_Tag key={pi} color="#00b8ff">📋 {p.name}: {(p.amount||0).toLocaleString()} {t.currency}</R_Tag>)}
              </div>
            </div>
          ))}
          <div style={{padding:"11px 14px",background:"#0b2018",borderTop:`1px solid ${G}33`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:900,fontSize:10,color:`${G}88`,letterSpacing:0.5}}>TOTAL</div>
            <div style={{fontSize:18,fontWeight:900,color:G}}>{total.toLocaleString()} <span style={{fontSize:9,color:`${G}66`}}>{t.currency}</span></div>
          </div>
        </div>
      )}
      {daysData.length>0&&<R_PdfBtn label={t.dlPdf} gen={false} onClick={()=>r_openPrint(pdfContent(),`StadBook_${year}-${String(month+1).padStart(2,"0")}`)}/>}
    </div>
  );
}

// ── REPORTS: All Tab ──────────────────────────────────────────────
function R_AllTab({bookings,subs,lang,t,stadiumName}){
  const now=new Date();
  const [mode,setMode]=useState("alltime");
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";

  const allBookingRows=useMemo(()=>{
    const arr=[];
    Object.entries(bookings).forEach(([dk,slots])=>{
      Object.entries(slots).forEach(([h,slot])=>{
        if(!slot)return;
        const d=new Date(dk+"T12:00:00");
        if(mode==="bymonth"&&(d.getFullYear()!==year||d.getMonth()!==month))return;
        arr.push({dk,hour:Number(h),...slot});
      });
    });
    return arr.sort((a,b)=>b.dk.localeCompare(a.dk)||a.hour-b.hour);
  },[bookings,mode,year,month]);

  const filteredSubs=useMemo(()=>{
    if(mode==="alltime")return subs;
    return subs.filter(s=>s.month===month&&s.year===year);
  },[subs,mode,year,month]);

  const paymentsInMonth=useMemo(()=>{
    if(mode==="alltime")return[];
    return subs.flatMap(s=>s.payments.filter(p=>{
      if(!p.date)return false;
      const d=new Date(p.date+"T12:00:00");
      return d.getFullYear()===year&&d.getMonth()===month;
    }).map(p=>({...p,sub:s})));
  },[subs,mode,year,month]);

  const totalMatchE=allBookingRows.filter(r=>r.status==="played"&&!r.subId).reduce((a,r)=>a+(r.price||0),0);
  const totalSubE=mode==="alltime"
    ?subs.reduce((a,s)=>a+s.payments.reduce((x,p)=>x+(p.amount||0),0),0)
    :subs.reduce((a,s)=>a+s.payments.filter(p=>{if(!p.date)return false;const d=new Date(p.date+"T12:00:00");return d.getFullYear()===year&&d.getMonth()===month;}).reduce((x,p)=>x+(p.amount||0),0),0);
  const totalUnpaid=filteredSubs.reduce((a,s)=>a+Math.max(0,(s.totalPrice||0)-s.payments.reduce((x,p)=>x+(p.amount||0),0)),0);
  const total=totalMatchE+totalSubE;
  const played=allBookingRows.filter(r=>r.status==="played").length;
  const mLabel=r_fmtMonthYear(year,month,lang);

  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportAll}</div>
        <div style="font-size:10px;color:#aaa;">${mode==="alltime"?t.since:mLabel}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="background:linear-gradient(135deg,#f0fdf8,#e6f9f2);border:2px solid #00D48A33;border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:9px;color:#00a86b;font-weight:700;margin-bottom:3px;">${t.totalGeneral.toUpperCase()}</div>
          <div style="font-size:32px;font-weight:900;color:#00a86b;line-height:1;">${total.toLocaleString()}</div>
          <div style="font-size:10px;color:#00a86b88;">${t.currency}</div></div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="background:#fff;border-radius:8px;padding:6px 10px;border:1px solid #00D48A22;">
              <div style="font-size:7px;color:#888;font-weight:700;">${t.matchEarn.toUpperCase()}</div>
              <div style="font-size:13px;font-weight:900;color:#00a86b;">${totalMatchE.toLocaleString()} ${t.currency}</div>
            </div>
            <div style="background:#fff;border-radius:8px;padding:6px 10px;border:1px solid #00b8ff22;">
              <div style="font-size:7px;color:#888;font-weight:700;">${t.subEarn.toUpperCase()}</div>
              <div style="font-size:13px;font-weight:900;color:#00b8ff;">${totalSubE.toLocaleString()} ${t.currency}</div>
            </div>
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;">
        <div style="border:1px solid #eee;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalMatches.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#4a90d9;">${played}</div>
        </div>
        <div style="border:1px solid #eee;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalSubsCount.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#00a86b;">${filteredSubs.length}</div>
        </div>
        <div style="border:1px solid #ffe0e0;border-radius:8px;padding:8px;text-align:center;background:#fff8f8;">
          <div style="font-size:7px;color:#e05555;font-weight:700;margin-bottom:3px;">${t.unpaid.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#e05555;">${totalUnpaid.toLocaleString()}</div>
          <div style="font-size:8px;color:#e05555aa;">${t.currency}</div>
        </div>
      </div>
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-bottom:6px;">${lang==="ar"?"المباريات":lang==="fr"?"MATCHS":"MATCHES"} (${allBookingRows.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:10px;margin-bottom:14px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"التاريخ":"DATE"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الساعة":"H"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":"CLIENT"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.currency}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الحالة":lang==="fr"?"STATUT":"STATUS"}</th>
        </tr></thead>
        <tbody>
          ${allBookingRows.slice(0,50).map((r,i)=>{
            const isP=r.status==="played";const isSub=!!r.subId;
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#888;">${r_fmtShort(r.dk,lang)}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#4a90d9;font-weight:700;">${r_fmt24(r.hour)}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${r.name||"—"}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:700;">${isSub?"—":`${r.price||0}`}</td>
              <td style="padding:5px 8px;"><span style="background:${isP?"#e6f9f2":isSub?"#fff8e0":"#fff0f0"};color:${isP?"#00a86b":isSub?"#d4a017":"#e05555"};border-radius:4px;padding:1px 5px;font-size:8px;font-weight:700;">${isSub?t.subLabel:isP?t.played:t.reserved}</span></td>
            </tr>`;
          }).join("")}
          ${allBookingRows.length>50?`<tr><td colspan="5" style="padding:8px;text-align:center;color:#bbb;font-size:9px;">... ${allBookingRows.length-50} ${t.more}</td></tr>`:""}
        </tbody>
      </table>
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-bottom:6px;">${t.allSubs.toUpperCase()} (${filteredSubs.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:10px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":"CLIENT"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الساعة":"H"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الشهر":lang==="fr"?"MOIS":"MONTH"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الإجمالي":"TOTAL"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.paid.toUpperCase()}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الحالة":lang==="fr"?"STATUT":"STATUS"}</th>
        </tr></thead>
        <tbody>
          ${filteredSubs.map((s,i)=>{
            const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
            const rem=Math.max(0,(s.totalPrice||0)-paid);
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${s.name||"—"}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#4a90d9;font-weight:700;">${r_fmt24(s.hour)}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#888;">${(R_MONTHS[lang]?.[s.month]||"")+" "+s.year}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};font-weight:800;">${(s.totalPrice||0).toLocaleString()}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:800;">${paid.toLocaleString()}</td>
              <td style="padding:5px 8px;"><span style="background:${rem===0?"#e6f9f2":"#fff0f0"};color:${rem===0?"#00a86b":"#e05555"};border-radius:4px;padding:1px 5px;font-size:8px;font-weight:700;">${rem===0?t.settled:`${rem.toLocaleString()} ${t.remaining}`}</span></td>
            </tr>
            <tr><td colspan="6" style="padding:4px 8px 8px;background:#f9fbff;border-bottom:1px solid #f0f0f0;"><div style="font-size:8px;color:#888;font-weight:700;margin-bottom:4px;">${lang==="ar"?"الأيام":lang==="fr"?"JOURS":"DAYS"} (${s.days?.length||0})</div><div style="display:flex;flex-wrap:wrap;gap:3px;">${(s.days||[]).map(d=>`<span style="background:#e6f0ff;color:#4a90d9;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;">${d} ${R_MONTHS[lang]?.[s.month]||""}</span>`).join("")}</div></td></tr>`;
          }).join("")}
        </tbody>
      </table>
      ${mode==="bymonth"&&filteredSubs.length>0?`
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px;">${lang==="ar"?"اشتراكات الشهر":lang==="fr"?"ABONNEMENTS DU MOIS":"MONTH SUBSCRIPTIONS"} (${filteredSubs.length})</div>
      ${filteredSubs.map(s=>{
        const spaid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
        const srem=Math.max(0,(s.totalPrice||0)-spaid);
        const monthPays=s.payments.filter(p=>{if(!p.date)return false;const d=new Date(p.date+"T12:00:00");return d.getFullYear()===year&&d.getMonth()===month;});
        return `<div style="margin-bottom:10px;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden;">
          <div style="background:#f8f8f8;padding:7px 10px;font-size:10px;font-weight:800;border-bottom:1px solid #eee;display:flex;justify-content:space-between;"><span>${s.name}</span><span style="color:#888;font-size:9px;">${r_fmt24(s.hour)} · ${(R_MONTHS[lang]?.[s.month]||"")+" "+s.year}</span></div>
          <div style="padding:6px 10px;border-bottom:1px solid #f0f0f0;"><div style="font-size:8px;color:#888;font-weight:700;margin-bottom:4px;">${lang==="ar"?"الأيام":lang==="fr"?"JOURS":"DAYS"} (${s.days?.length||0})</div><div style="display:flex;flex-wrap:wrap;gap:3px;">${(s.days||[]).map(d=>`<span style="background:#e6f0ff;color:#4a90d9;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;">${d} ${R_MONTHS[lang]?.[s.month]||""}</span>`).join("")}</div></div>
          <div style="padding:5px 10px;display:flex;gap:14px;border-bottom:${monthPays.length>0?"1px solid #f0f0f0":"none"};">
            <span style="font-size:9px;color:#333;">${lang==="ar"?"الإجمالي":lang==="fr"?"Total":"Total"}: <b>${(s.totalPrice||0).toLocaleString()} ${t.currency}</b></span>
            <span style="font-size:9px;color:#00a86b;">${lang==="ar"?"مدفوع":lang==="fr"?"Payé":"Paid"}: <b>${spaid.toLocaleString()} ${t.currency}</b></span>
            <span style="font-size:9px;color:${srem>0?"#e05555":"#00a86b"};">${lang==="ar"?"متبقي":lang==="fr"?"Restant":"Remaining"}: <b>${srem.toLocaleString()} ${t.currency}</b></span>
          </div>
          ${monthPays.length>0?`<div style="padding:5px 10px;">${monthPays.map(p=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f5f5f5;"><span style="font-size:9px;color:#555;">${p.date}</span><span style="font-size:10px;font-weight:800;color:#00a86b;">+${(p.amount||0).toLocaleString()} ${t.currency}</span></div>`).join("")}</div>`:""}
        </div>`;
      }).join("")}
      `:""}
      ${mode==="bymonth"&&paymentsInMonth.filter(p=>!filteredSubs.find(s=>s.id===p.sub.id)).length>0?`
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-top:8px;margin-bottom:8px;">${lang==="ar"?"مدفوعات أخرى مستلمة هذا الشهر":lang==="fr"?"AUTRES PAIEMENTS REÇUS CE MOIS":"OTHER PAYMENTS THIS MONTH"}</div>
      ${paymentsInMonth.filter(p=>!filteredSubs.find(s=>s.id===p.sub.id)).map(p=>`
        <div style="margin-bottom:6px;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden;">
          <div style="background:#f8f8f8;padding:6px 10px;font-size:10px;font-weight:800;border-bottom:1px solid #eee;display:flex;justify-content:space-between;"><span>${p.sub.name}</span><span style="color:#d4a017;font-size:9px;">${r_fmt24(p.sub.hour)} · ${(R_MONTHS[lang]?.[p.sub.month]||"")+" "+p.sub.year}</span></div>
          <div style="padding:5px 10px;display:flex;justify-content:space-between;"><span style="font-size:9px;color:#555;">${p.date}</span><span style="font-size:10px;font-weight:800;color:#00a86b;">+${(p.amount||0).toLocaleString()} ${t.currency}</span></div>
        </div>`).join("")}
      `:""}
      <div style="border-top:1px solid #eee;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;font-size:8px;color:#ccc;">
        <span>StadBook · ${t.reportAll}</span><span>${stadiumName}</span>
      </div>
    </div>`;
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <button onClick={()=>setMode("alltime")} style={{padding:"11px",borderRadius:12,border:"none",fontWeight:800,fontSize:12,background:mode==="alltime"?G:CARD,color:mode==="alltime"?"#001a0e":"#555"}}>🕐 {t.allTime}</button>
        <button onClick={()=>setMode("bymonth")} style={{padding:"11px",borderRadius:12,border:`1px solid ${BORDER}`,fontWeight:800,fontSize:12,background:mode==="bymonth"?G:CARD,color:mode==="bymonth"?"#001a0e":"#555"}}>📅 {t.byMonth}</button>
      </div>
      {mode==="bymonth"&&(
        <div style={{background:CARD,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <button onClick={prevM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
            <div style={{fontWeight:900,fontSize:16,color:"#fff"}}>{mLabel}</div>
            <button onClick={nextM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
          </div>
        </div>
      )}
      <div style={{background:"linear-gradient(135deg,#071510,#0e2a1e)",borderRadius:16,padding:"16px",border:`1px solid ${G}44`}}>
        <div style={{fontSize:9,color:`${G}88`,fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{mode==="alltime"?t.since.toUpperCase():mLabel.toUpperCase()}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:36,fontWeight:900,color:G,lineHeight:1}}>{total.toLocaleString()}</div>
            <div style={{fontSize:12,color:`${G}66`,marginTop:2}}>{t.currency}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <div style={{background:"#0D0F18",borderRadius:8,padding:"6px 10px",border:`1px solid ${G}33`}}>
              <div style={{fontSize:7,color:"#444",fontWeight:700}}>MATCHES</div>
              <div style={{fontSize:13,fontWeight:900,color:G}}>{totalMatchE.toLocaleString()} {t.currency}</div>
            </div>
            <div style={{background:"#0D0F18",borderRadius:8,padding:"6px 10px",border:"1px solid #00b8ff33"}}>
              <div style={{fontSize:7,color:"#444",fontWeight:700}}>ABONNEMENTS</div>
              <div style={{fontSize:13,fontWeight:900,color:"#00b8ff"}}>{totalSubE.toLocaleString()} {t.currency}</div>
            </div>
          </div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        <R_StatCard label={t.totalMatches} val={played} unit="" color="#7eb8ff" bg="#0a0e1f"/>
        <R_StatCard label={t.totalSubsCount} val={filteredSubs.length} unit="" color={G} bg="#071510"/>
        <R_StatCard label={t.unpaid} val={totalUnpaid.toLocaleString()} unit={t.currency} color="#ff5555" bg="#1f0e0e"/>
      </div>
      <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{lang==="ar"?"المباريات":lang==="fr"?"MATCHS":"MATCHES"}</div>
          <div style={{fontSize:9,color:G,fontWeight:700}}>{allBookingRows.length} total</div>
        </div>
        {allBookingRows.slice(0,8).map((r,i)=>{
          const isPlayed=r.status==="played";const isSub=!!r.subId;
          return(
            <div key={i} style={{padding:"9px 14px",borderBottom:i<Math.min(8,allBookingRows.length)-1?`1px solid ${BORDER}22`:"none",display:"flex",alignItems:"center",gap:8}}>
              <div style={{minWidth:36,height:36,borderRadius:8,background:isPlayed?isSub?"#d4a01722":`${G}22`:"#1c2030",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <span style={{fontSize:11,fontWeight:900,color:isPlayed?isSub?"#d4a017":G:"#555"}}>{r_fmt24(r.hour).slice(0,2)}</span>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:12,color:isPlayed?"#888":"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name||"—"}</div>
                <div style={{fontSize:9,color:"#444"}}>{r_fmtShort(r.dk,lang)} · {isSub?t.subLabel:isPlayed?t.played:t.reserved}{!isSub?` · ${r.price||0} ${t.currency}`:""}</div>
              </div>
              {isPlayed&&<span style={{fontSize:10,color:G,flexShrink:0}}>✓</span>}
            </div>
          );
        })}
        {allBookingRows.length>8&&(
          <div style={{padding:"8px 14px",background:"#071510",borderTop:`1px solid ${G}22`,textAlign:"center",fontSize:9,color:`${G}66`,fontWeight:700}}>+ {allBookingRows.length-8} {t.more}</div>
        )}
      </div>
      <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{t.allSubs.toUpperCase()}</div>
          <div style={{fontSize:9,color:"#00b8ff",fontWeight:700}}>{filteredSubs.length} total</div>
        </div>
        {filteredSubs.slice(0,6).map((s,i)=>{
          const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
          const rem=Math.max(0,(s.totalPrice||0)-paid);
          return(
            <div key={s.id||i} style={{padding:"9px 14px",borderBottom:i<Math.min(6,filteredSubs.length)-1?`1px solid ${BORDER}22`:"none",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:800,fontSize:12,color:"#fff"}}>{s.name}</div>
                <div style={{fontSize:9,color:"#555",marginTop:1}}>{r_fmt24(s.hour)} · {R_MONTHS[lang][s.month]} {s.year}</div>
                <div style={{fontSize:9,color:"#444"}}>{paid.toLocaleString()} / {(s.totalPrice||0).toLocaleString()} {t.currency}</div>
              </div>
              <R_Tag color={rem===0?G:"#ff5555"}>{rem===0?t.settled:`${rem.toLocaleString()} ${t.remaining}`}</R_Tag>
            </div>
          );
        })}
        {filteredSubs.length>6&&(
          <div style={{padding:"8px 14px",background:"#071510",borderTop:`1px solid ${G}22`,textAlign:"center",fontSize:9,color:`${G}66`,fontWeight:700}}>+ {filteredSubs.length-6} {t.more}</div>
        )}
      </div>
      <R_PdfBtn label={t.dlPdf} gen={false} onClick={()=>r_openPrint(pdfContent(),"StadBook_Complet")}/>
    </div>
  );
}

// ── REPORTS: Main container ───────────────────────────────────────
function ReportsTab({lang,uid,bookings,subs,stadiumName}){
  const t=R_T[lang]||R_T.fr;
  const [subTab,setSubTab]=useState("planning");
  const subsData=subs||[];
  const SUBTABS=[
    {id:"planning",label:t.tabPlanning},
    {id:"subs",label:t.tabSubs},
    {id:"earnings",label:t.tabEarnings},
    {id:"all",label:t.tabAll},
  ];

  const isRTL=lang==="ar";
  return(
    <div style={{display:"flex",flexDirection:"column",fontFamily:isRTL?"'Cairo',sans-serif":"'Nunito',sans-serif",direction:isRTL?"rtl":"ltr",background:BG}}>
      {/* Sub-tab bar */}
      <div style={{background:CARD,padding:"6px 10px",borderBottom:`1px solid ${BORDER}`,display:"flex",gap:4,position:"sticky",top:0,zIndex:19}}>
        {SUBTABS.map(tb=>{
          const active=subTab===tb.id;
          return(
            <button key={tb.id} onClick={()=>setSubTab(tb.id)}
              style={{flex:1,background:active?G:"#0D0F18",borderRadius:10,padding:"9px 2px",border:active?"none":`1px solid ${BORDER}`,fontWeight:900,fontSize:9,color:active?"#001a0e":"#444",letterSpacing:0.2,transition:"background 0.15s",fontFamily:"inherit"}}>
              {tb.label.toUpperCase()}
            </button>
          );
        })}
      </div>
      {/* Content */}
      <div style={{animation:"fadeIn 0.25s ease forwards"}}>
        {subTab==="planning"&&<R_PlanningTab bookings={bookings} lang={lang} t={t} stadiumName={stadiumName}/>}
        {subTab==="subs"&&<R_SubsTab subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
        {subTab==="earnings"&&<R_EarningsTab bookings={bookings} subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
        {subTab==="all"&&<R_AllTab bookings={bookings} subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

  Object.keys(bookings).forEach(function(date){
    if(
      !bookings[date] ||
      Object.keys(bookings[date]).length === 0
    ){
      delete bookings[date];
    }
  });
}
