function toKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmt24(h){return `${String(h).padStart(2,"0")}:00`;}
function fmtDate(dk,lang){
  const d=new Date(dk+"T12:00:00");
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";
  return d.toLocaleDateString(locale,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function fmtShort(dk,lang){
  const d=new Date(dk+"T12:00:00");
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";
  return d.toLocaleDateString(locale,{weekday:"short",day:"numeric",month:"short"});
}
function fmtMonthYear(y,m,lang){
  return new Date(y,m,1).toLocaleDateString(lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB",{month:"long",year:"numeric"});
}

function Spin({s=32}){
  return <div style={{width:s,height:s,border:`${s<=20?2:3}px solid ${G}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite",display:"inline-block"}}/>;
}

}

  useEffect(()=>{
    let b=false,s=false,u=false;
    const done=()=>{if(b&&s&&u)setLoading(false);};
    const u1=db.collection("bookings").doc(uid).onSnapshot(snap=>{setBookings(snap.exists?snap.data().data||{}:{});b=true;done();});
    const u2=db.collection("subs").doc(uid).onSnapshot(snap=>{setSubsData(snap.exists?snap.data().list||[]:[]);s=true;done();});
    const u3=db.collection("users").doc(uid).onSnapshot(snap=>{setUserData(snap.exists?snap.data():null);u=true;done();});

            <div style={{fontSize:9,color:"#444",fontWeight:700,letterSpacing:1}}>{t.appName.toUpperCase()}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {["fr","en","ar"].map(l=>(
            <button key={l} onClick={()=>setLang(l)} style={{background:lang===l?G:CARD,border:`1.5px solid ${lang===l?G:BORDER}`,borderRadius:10,padding:"5px 9px",fontWeight:800,fontSize:11,color:lang===l?G_DARK:"#555"}}>
              {FLAGS[l]}
            </button>
          ))}
          <button onClick={()=>auth.signOut()} style={{background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:8,padding:"6px 9px",fontWeight:700,fontSize:11,marginLeft:2}}>{t.signOut}</button>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{background:CARD,padding:"6px 10px",borderBottom:`1px solid ${BORDER}`,display:"flex",gap:4,position:"sticky",top:57,zIndex:19}}>
        {TABS.map(tb=>{
          const active=tab===tb.id;
          return(
            <button key={tb.id} onClick={()=>setTab(tb.id)}
              style={{flex:1,background:active?G:BG,borderRadius:10,padding:"8px 2px",border:active?"none":`1px solid ${BORDER}`,display:"flex",flexDirection:"column",alignItems:"center",gap:2,transition:"background 0.15s"}}>
              <div style={{color:active?G_DARK:"#444",lineHeight:0}}>{tb.icon}</div>
              <span style={{fontSize:7,fontWeight:900,color:active?G_DARK:"#444",letterSpacing:0.2}}>{tb.label.toUpperCase()}</span>
            </button>
          );
        })}
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",paddingBottom:20}}>
        {loading?(
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 0"}}><Spin/></div>
        ):(
          <div style={{animation:"fadeIn 0.25s ease forwards"}}>
            {tab==="planning"&&<PlanningTab bookings={bookings} lang={lang} t={t} stadiumName={stadiumName}/>}
            {tab==="subs"&&<SubsTab subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
            {tab==="earnings"&&<EarningsTab bookings={bookings} subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
            {tab==="all"&&<AllTab bookings={bookings} subs={subsData} lang={lang} t={t} stadiumName={stadiumName}/>}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// TAB 1 — PLANNING
// ═══════════════════════════════════════════════
function PlanningTab({bookings,lang,t,stadiumName}){
  const today=toKey(new Date());
  const [from,setFrom]=useState(today);
  const [to,setTo]=useState(today);
  const [gen,setGen]=useState(false);

  const rows=useMemo(()=>{
    const arr=[];
    Object.entries(bookings).forEach(([dk,slots])=>{
      if(dk<from||dk>to)return;
      Object.entries(slots).forEach(([h,slot])=>{
        if(!slot)return;
        arr.push({dk,hour:Number(h),...slot});
      });
    });
    return arr.sort((a,b)=>a.dk!==b.dk?a.dk.localeCompare(b.dk):a.hour-b.hour);
  },[bookings,from,to]);

  const earned=rows.filter(r=>r.status==="played"&&!r.subId).reduce((a,r)=>a+(r.price||0),0);
  const played=rows.filter(r=>r.status==="played").length;
  const reserved=rows.filter(r=>r.status==="reserved").length;

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";
    const period=from===to?fmtDate(from,lang):`${fmtDate(from,lang)} → ${fmtDate(to,lang)}`;
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportPlanning}</div>
        <div style="font-size:10px;color:#aaa;margin-top:1px;">${period}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        <div style="border:1.5px solid #00D48A22;border-radius:8px;padding:10px;text-align:center;background:#00D48A08;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalEarnings.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00D48A;">${earned.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
        <div style="border:1.5px solid #4a90d922;border-radius:8px;padding:10px;text-align:center;background:#4a90d908;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalPlayed.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#4a90d9;">${played}</div>
          <div style="font-size:8px;color:#aaa;">${t.matches}</div>
        </div>
        <div style="border:1.5px solid #d4a01722;border-radius:8px;padding:10px;text-align:center;background:#d4a01708;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalReserved.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#d4a017;">${reserved}</div>
          <div style="font-size:8px;color:#aaa;">${t.matches}</div>
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"التاريخ":"DATE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.hours.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":"CLIENT"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الهاتف":lang==="fr"?"TÉL":"PHONE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.currency}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الحالة":lang==="fr"?"STATUT":"STATUS"}</th>
        </tr></thead>
        <tbody>
          ${rows.map((r,i)=>{
            const played=r.status==="played";const isSub=!!r.subId;
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#888;">${fmtShort(r.dk,lang)}</td>
              <td style="padding:6px 8px;color:#4a90d9;font-weight:700;">${fmt24(r.hour)}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${r.name||"—"}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#aaa;">${r.phone||"—"}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:800;color:#00D48A;">${isSub?"—":`${r.price||0} ${t.currency}`}</td>
              <td style="padding:6px 8px;"><span style="background:${played?"#e6f9f2":isSub?"#fff8e0":"#fff0f0"};color:${played?"#00a86b":isSub?"#d4a017":"#e05555"};border-radius:4px;padding:2px 6px;font-size:9px;font-weight:700;">${isSub?t.subLabel:played?t.played:t.reserved}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="border-top:1px solid #eee;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;font-size:8px;color:#ccc;">
        <span>StadBook · ${t.reportPlanning}</span><span>${stadiumName}</span>
      </div>
    </div>`;
  };

  const generate=()=>{
    if(!rows.length)return;
    openPrint(pdfContent(),`StadBook_Planning_${from}_${to}`);
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      {/* Date range */}
      <div style={{background:CARD,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
        <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>{t.pickRange.toUpperCase()}</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:8,color:"#444",fontWeight:700,marginBottom:4}}>{t.from.toUpperCase()}</div>
            <input type="date" value={from} onChange={e=>{setFrom(e.target.value);if(e.target.value>to)setTo(e.target.value);}}
              style={{width:"100%",background:BG,border:`1.5px solid ${BORDER}`,borderRadius:8,padding:"9px 10px",color:"#fff",fontSize:13,fontWeight:700}}
              onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
          </div>
          <div style={{color:"#333",paddingTop:16,fontSize:16}}>→</div>
          <div style={{flex:1}}>
            <div style={{fontSize:8,color:"#444",fontWeight:700,marginBottom:4}}>{t.to.toUpperCase()}</div>
            <input type="date" value={to} onChange={e=>setTo(e.target.value)} min={from}
              style={{width:"100%",background:BG,border:`1.5px solid ${BORDER}`,borderRadius:8,padding:"9px 10px",color:"#fff",fontSize:13,fontWeight:700}}
              onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
          </div>
        </div>
        {from&&<div style={{fontSize:10,color:"#444",marginTop:6,fontWeight:600}}>{from===to?fmtDate(from,lang):`${fmtShort(from,lang)} → ${fmtShort(to,lang)}`}</div>}
      </div>

      {/* Summary */}
      {rows.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          <StatCard label={t.totalEarnings} val={earned.toLocaleString()} unit={t.currency} color={G} bg="#071510"/>
          <StatCard label={t.totalPlayed} val={played} unit={t.matches} color="#7eb8ff" bg="#0a0e1f"/>
          <StatCard label={t.totalReserved} val={reserved} unit={t.matches} color="#ffd700" bg="#1a1400"/>
        </div>
      )}

      {/* Matches */}
      {rows.length===0?(
        <Empty text={t.noMatches}/>
      ):(
        <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>
            {t.tabPlanning.toUpperCase()} · {rows.length} {t.matches.toUpperCase()}
          </div>
          {rows.map((r,i)=>{
            const isPlayed=r.status==="played";const isSub=!!r.subId;
            const hd=r.hour===0?12:r.hour>12?r.hour-12:r.hour;
            return(
              <div key={i} style={{padding:"11px 14px",borderBottom:i<rows.length-1?`1px solid ${BORDER}22`:"none",display:"flex",alignItems:"center",gap:8}}>
                <div style={{minWidth:44,height:44,borderRadius:10,background:isPlayed?isSub?"#d4a01722":`${G}22`:"#1c2030",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:13,fontWeight:900,color:isPlayed?isSub?"#d4a017":G:"#555",lineHeight:1.1}}>{hd}</span>
                  <span style={{fontSize:7,fontWeight:700,color:isPlayed?isSub?"#d4a01766":`${G}66`:"#333"}}>{r.hour>=12?"PM":"AM"}</span>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:9,color:"#444",marginBottom:1}}>{fmtShort(r.dk,lang)}</div>
                  <div style={{fontWeight:800,fontSize:13,color:isPlayed?"#777":"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name||"—"}</div>
                  {r.phone&&<div style={{fontSize:10,color:"#444",marginTop:1}}>📞 {r.phone}</div>}
                  <div style={{fontSize:10,marginTop:1,fontWeight:700,color:isPlayed?isSub?"#d4a017":`${G}88`:"#7eb8ff"}}>
                    {isSub?t.subLabel:isPlayed?t.played:t.reserved}
                    {!isSub&&<span style={{color:"#555"}}> · {r.price||0} {t.currency}</span>}
                  </div>
                </div>
                {isPlayed&&<div style={{width:26,height:26,borderRadius:"50%",background:`${G}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:G,flexShrink:0}}>✓</div>}
                {!isPlayed&&!isSub&&<div style={{width:8,height:8,borderRadius:"50%",background:"#ffd700",flexShrink:0}}/>}
              </div>
            );
          })}
        </div>
      )}
      {rows.length>0&&<PdfBtn label={t.dlPdf} gen={false} onClick={generate}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// TAB 2 — SUBSCRIPTIONS
// ═══════════════════════════════════════════════
function SubsTab({subs,lang,t,stadiumName}){
  const [filter,setFilter]=useState("all");
  const [gen,setGen]=useState(false);

  const shown=filter==="active"?subs.filter(s=>!s.archived):filter==="archived"?subs.filter(s=>s.archived):subs;
  const totalPaid=subs.reduce((a,s)=>a+s.payments.reduce((x,p)=>x+(p.amount||0),0),0);
  const totalPrice=subs.reduce((a,s)=>a+(s.totalPrice||0),0);
  const totalRem=Math.max(0,totalPrice-totalPaid);

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportSubs}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        <div style="border:1.5px solid #00D48A22;border-radius:8px;padding:10px;text-align:center;background:#00D48A08;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalSubs.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00D48A;">${subs.length}</div>
        </div>
        <div style="border:1.5px solid #00b8ff22;border-radius:8px;padding:10px;text-align:center;background:#00b8ff08;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.paid.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00b8ff;">${totalPaid.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
        <div style="border:1.5px solid #e0555522;border-radius:8px;padding:10px;text-align:center;background:#e0555508;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.remaining.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#e05555;">${totalRem.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":"CLIENT"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.hours.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.days.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الإجمالي":"TOTAL"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.paid.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.remaining.toUpperCase()}</th>
        </tr></thead>
        <tbody>
          ${shown.map((s,i)=>{
            const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
            const rem=Math.max(0,(s.totalPrice||0)-paid);
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${s.name||"—"}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#4a90d9;font-weight:700;">${fmt24(s.hour)}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};">${s.days?.length||0}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:800;">${(s.totalPrice||0).toLocaleString()} ${t.currency}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:800;">${paid.toLocaleString()} ${t.currency}</td>
              <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:${rem>0?"#e05555":"#00a86b"};font-weight:800;">${rem.toLocaleString()} ${t.currency}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-bottom:8px;">${t.paymentDetail.toUpperCase()}</div>
      ${shown.map(s=>{
        if(!s.payments.length)return "";
        return `<div style="margin-bottom:10px;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden;">
          <div style="background:#f8f8f8;padding:7px 10px;font-size:10px;font-weight:800;border-bottom:1px solid #eee;">${s.name}</div>
          ${s.payments.map((p,i,arr)=>{
            const d=new Date((p.date||"")+"T12:00:00");
            const mLabel=isNaN(d)?"":`${MONTHS[lang]?.[d.getMonth()]||""} ${d.getFullYear()}`;
            return `<div style="padding:5px 10px;display:flex;justify-content:space-between;border-bottom:${i<arr.length-1?"1px solid #f5f5f5":"none"};">
              <div style="display:flex;align-items:center;gap:6px;">
                <div style="width:5px;height:5px;border-radius:50%;background:#00D48A;"></div>
                <span style="font-size:9px;color:#555;">${p.date||""}</span>
                <span style="font-size:9px;color:#aaa;">${mLabel}</span>
              </div>
              <span style="font-size:11px;font-weight:800;color:#00a86b;">+${(p.amount||0).toLocaleString()} ${t.currency}</span>
            </div>`;
          }).join("")}
        </div>`;
      }).join("")}
      <div style="border-top:1px solid #eee;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-size:8px;color:#ccc;">
        <span>StadBook · ${t.reportSubs}</span><span>${stadiumName}</span>
      </div>
    </div>`;
  };

  const generate=()=>{
    if(!shown.length)return;
    openPrint(pdfContent(),"StadBook_Abonnements");
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      {/* Summary */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        <StatCard label={t.totalSubs} val={subs.length} unit="" color={G} bg="#071510"/>
        <StatCard label={t.paid} val={totalPaid.toLocaleString()} unit={t.currency} color="#00b8ff" bg="#0a1828"/>
        <StatCard label={t.remaining} val={totalRem.toLocaleString()} unit={t.currency} color="#ff9955" bg="#1f1208"/>
      </div>
      {/* Filter */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        {[["all",`${t.filterAll} (${subs.length})`],["active",`${t.filterActive} (${subs.filter(s=>!s.archived).length})`],["archived",`${t.filterArchived} (${subs.filter(s=>s.archived).length})`]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{padding:"9px 4px",borderRadius:10,border:"none",fontWeight:800,fontSize:10,background:filter===v?G:CARD,color:filter===v?G_DARK:"#555"}}>{l}</button>
        ))}
      </div>
      {/* Cards */}
      {shown.length===0?<Empty text={t.noSubs}/>:(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {shown.map(s=>{
            const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
            const rem=Math.max(0,(s.totalPrice||0)-paid);
            const pct=s.totalPrice>0?Math.min(100,Math.round(paid/s.totalPrice*100)):0;
            const full=rem===0;
            return(
              <div key={s.id} style={{background:CARD,borderRadius:14,padding:"13px",border:`1.5px solid ${full?G+"44":BORDER}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div>
                    <div style={{fontWeight:900,fontSize:14,color:"#fff"}}>{s.name}</div>
                    {s.phone&&<div style={{fontSize:10,color:"#444",marginTop:1}}>📞 {s.phone}</div>}
                  </div>
                  <div style={{textAlign:"right"}}>

                  <div style={{borderTop:`1px solid ${BORDER}88`,paddingTop:8,marginTop:4}}>
                    <div style={{fontSize:8,color:"#444",fontWeight:700,letterSpacing:0.3,marginBottom:5}}>{t.payments.toUpperCase()}</div>
                    {s.payments.map((p,i)=>{
                      const d=new Date((p.date||"")+"T12:00:00");
                      const mLabel=isNaN(d)?"":`${MONTHS[lang]?.[d.getMonth()]||""} ${d.getFullYear()}`;
                      return(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:i<s.payments.length-1?`1px solid ${BORDER}44`:"none"}}>

                            <span style={{fontSize:10,color:"#555"}}>{p.date||""}</span>
                            <span style={{fontSize:9,color:"#333",background:"#1c2030",borderRadius:4,padding:"1px 5px"}}>{mLabel}</span>
                          </div>

                    })}

                )}
              </div>
            );
          })}
        </div>
      )}
      {shown.length>0&&<PdfBtn label={t.dlPdf} gen={false} onClick={generate}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// TAB 3 — EARNINGS
// ═══════════════════════════════════════════════
function EarningsTab({bookings,subs,lang,t,stadiumName}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [gen,setGen]=useState(false);
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";

  const daysData=useMemo(()=>{
    const map={};
    Object.entries(bookings).forEach(([dk,slots])=>{
      const d=new Date(dk+"T12:00:00");
      if(d.getFullYear()!==year||d.getMonth()!==month)return;
      const matchE=Object.values(slots).filter(s=>s&&s.status==="played"&&!s.subId).reduce((a,s)=>a+(s.price||0),0);
      const matchCount=Object.values(slots).filter(s=>s&&s.status==="played").length;
      if(matchE>0||matchCount>0){
        if(!map[dk])map[dk]={matchE:0,subE:0,matchCount:0,subPays:[]};
        map[dk].matchE+=matchE;map[dk].matchCount+=matchCount;
      }
    });
    subs.forEach(s=>{
      (s.payments||[]).forEach(p=>{
        if(!p.date)return;
        const d=new Date(p.date+"T12:00:00");
        if(d.getFullYear()!==year||d.getMonth()!==month)return;
        if(!map[p.date])map[p.date]={matchE:0,subE:0,matchCount:0,subPays:[]};
        map[p.date].subE+=(p.amount||0);
        map[p.date].subPays.push({name:s.name,amount:p.amount});
      });
    });
    return Object.entries(map).sort(([a],[b])=>a.localeCompare(b));
  },[bookings,subs,year,month]);

  const totalMatchE=daysData.reduce((a,[,d])=>a+d.matchE,0);
  const totalSubE=daysData.reduce((a,[,d])=>a+d.subE,0);
  const total=totalMatchE+totalSubE;
  const mLabel=fmtMonthYear(year,month,lang);

  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportEarnings} — ${mLabel}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="background:linear-gradient(135deg,#f0fdf8,#e6f9f2);border:2px solid #00D48A33;border-radius:12px;padding:14px;margin-bottom:12px;text-align:center;">
        <div style="font-size:9px;color:#00a86b;font-weight:700;margin-bottom:4px;">${t.totalMonth.toUpperCase()} — ${mLabel}</div>
        <div style="font-size:36px;font-weight:900;color:#00a86b;line-height:1;">${total.toLocaleString()}</div>
        <div style="font-size:11px;color:#00a86b88;margin-top:3px;">${t.currency}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <div style="border:1.5px solid #00b8ff22;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.subEarn.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00b8ff;">${totalSubE.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
        <div style="border:1.5px solid #00D48A22;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.matchEarn.toUpperCase()}</div>
          <div style="font-size:20px;font-weight:900;color:#00a86b;">${totalMatchE.toLocaleString()}</div>
          <div style="font-size:8px;color:#aaa;">${t.currency}</div>
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"التاريخ":"DATE"}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.matchEarn.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.subEarn.toUpperCase()}</th>
          <th style="padding:7px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الإجمالي":"TOTAL"}</th>
        </tr></thead>
        <tbody>
          ${daysData.map(([dk,d],i)=>`<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${fmtShort(dk,lang)}</td>
            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:700;">${d.matchE>0?d.matchE.toLocaleString()+" "+t.currency:"—"}</td>
            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};color:#00b8ff;font-weight:700;">${d.subE>0?d.subE.toLocaleString()+" "+t.currency:"—"}</td>
            <td style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-weight:900;">${(d.matchE+d.subE).toLocaleString()} ${t.currency}</td>
          </tr>`).join("")}
          <tr style="background:#f0fdf8;border-top:2px solid #00D48A;">
            <td style="padding:8px;text-align:${isRTL?"right":"left"};font-weight:900;">${lang==="ar"?"الإجمالي":"TOTAL"}</td>
            <td style="padding:8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:900;">${totalMatchE.toLocaleString()} ${t.currency}</td>
            <td style="padding:8px;text-align:${isRTL?"right":"left"};color:#00b8ff;font-weight:900;">${totalSubE.toLocaleString()} ${t.currency}</td>
            <td style="padding:8px;text-align:${isRTL?"right":"left"};font-weight:900;font-size:14px;">${total.toLocaleString()} ${t.currency}</td>
          </tr>
        </tbody>
      </table>
      <div style="border-top:1px solid #eee;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;font-size:8px;color:#ccc;">
        <span>StadBook · ${t.reportEarnings}</span><span>${stadiumName} · ${mLabel}</span>
      </div>
    </div>`;
  };

  const generate=()=>{
    if(!daysData.length)return;
    openPrint(pdfContent(),`StadBook_${year}-${String(month+1).padStart(2,"0")}`);
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      {/* Month picker */}
      <div style={{background:CARD,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
        <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>{t.pickMonth.toUpperCase()}</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={prevM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
          <div style={{fontWeight:900,fontSize:16,color:"#fff"}}>{mLabel}</div>
          <button onClick={nextM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
        </div>
      </div>
      {/* Big total */}
      <div style={{background:"linear-gradient(135deg,#071510,#0e2a1e)",borderRadius:16,padding:"18px",border:`1px solid ${G}44`,textAlign:"center"}}>
        <div style={{fontSize:9,color:`${G}88`,fontWeight:700,letterSpacing:0.8,marginBottom:4}}>{t.totalMonth.toUpperCase()}</div>
        <div style={{fontSize:40,fontWeight:900,color:G,lineHeight:1}}>{total.toLocaleString()}</div>
        <div style={{fontSize:13,color:`${G}77`,marginTop:4}}>{t.currency}</div>
      </div>
      {/* Split */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <div style={{background:"linear-gradient(135deg,#0a1220,#0e1a2e)",borderRadius:14,padding:"13px",border:"1px solid #00b8ff44",textAlign:"center"}}>
          <div style={{fontSize:8,color:"#00b8ff88",fontWeight:700,marginBottom:5}}>{t.subEarn.toUpperCase()}</div>
          <div style={{fontSize:24,fontWeight:900,color:"#00b8ff"}}>{totalSubE.toLocaleString()}</div>
          <div style={{fontSize:10,color:"#00b8ff55"}}>{t.currency}</div>
        </div>
        <div style={{background:"linear-gradient(135deg,#071510,#0b1e14)",borderRadius:14,padding:"13px",border:`1px solid ${G}44`,textAlign:"center"}}>
          <div style={{fontSize:8,color:`${G}88`,fontWeight:700,marginBottom:5}}>{t.matchEarn.toUpperCase()}</div>
          <div style={{fontSize:24,fontWeight:900,color:G}}>{totalMatchE.toLocaleString()}</div>
          <div style={{fontSize:10,color:`${G}55`}}>{t.currency}</div>
        </div>
      </div>
      {/* Day by day */}
      {daysData.length===0?<Empty text={t.noEarnings}/>:(
        <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{t.perDay.toUpperCase()}</div>
          {daysData.map(([dk,d],i)=>(
            <div key={dk} style={{padding:"11px 14px",borderBottom:i<daysData.length-1?`1px solid ${BORDER}22`:"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:d.subPays.length>0?5:0}}>
                <div>
                  <div style={{fontWeight:800,fontSize:13}}>{fmtShort(dk,lang)}</div>
                  {d.matchCount>0&&<div style={{fontSize:10,color:"#444",marginTop:1}}>⚽ {d.matchCount} {t.matches}</div>}
                </div>
                <div style={{fontSize:16,fontWeight:900,color:"#fff"}}>{(d.matchE+d.subE).toLocaleString()} <span style={{fontSize:9,color:"#444"}}>{t.currency}</span></div>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:4}}>
                {d.matchE>0&&<Tag color={G}>⚽ {d.matchE.toLocaleString()} {t.currency}</Tag>}
                {d.subPays.map((p,pi)=><Tag key={pi} color="#00b8ff">📋 {p.name}: {(p.amount||0).toLocaleString()} {t.currency}</Tag>)}
              </div>
            </div>
          ))}
          <div style={{padding:"11px 14px",background:"#0b2018",borderTop:`1px solid ${G}33`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:900,fontSize:10,color:`${G}88`,letterSpacing:0.5}}>TOTAL</div>
            <div style={{fontSize:18,fontWeight:900,color:G}}>{total.toLocaleString()} <span style={{fontSize:9,color:`${G}66`}}>{t.currency}</span></div>
          </div>
        </div>
      )}
      {daysData.length>0&&<PdfBtn label={t.dlPdf} gen={false} onClick={generate}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// TAB 4 — ALL
// ═══════════════════════════════════════════════
function AllTab({bookings,subs,lang,t,stadiumName}){
  const now=new Date();
  const [mode,setMode]=useState("alltime"); // alltime | bymonth
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [gen,setGen]=useState(false);
  const locale=lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB";

  const allBookingRows=useMemo(()=>{
    const arr=[];
    Object.entries(bookings).forEach(([dk,slots])=>{
      Object.entries(slots).forEach(([h,slot])=>{
        if(!slot)return;
        const d=new Date(dk+"T12:00:00");
        if(mode==="bymonth"&&(d.getFullYear()!==year||d.getMonth()!==month))return;
        arr.push({dk,hour:Number(h),...slot});
      });
    });
    return arr.sort((a,b)=>b.dk.localeCompare(a.dk)||a.hour-b.hour);
  },[bookings,mode,year,month]);

  const filteredSubs=useMemo(()=>{
    if(mode==="alltime")return subs;
    return subs.filter(s=>{
      const created=(s.createdAt||"").substring(0,7);
      return created===`${year}-${String(month+1).padStart(2,"0")}`;
    });
  },[subs,mode,year,month]);

  const totalMatchE=allBookingRows.filter(r=>r.status==="played"&&!r.subId).reduce((a,r)=>a+(r.price||0),0);
  const totalSubE=filteredSubs.reduce((a,s)=>a+s.payments.reduce((x,p)=>x+(p.amount||0),0),0);
  const totalUnpaid=filteredSubs.reduce((a,s)=>a+Math.max(0,(s.totalPrice||0)-s.payments.reduce((x,p)=>x+(p.amount||0),0)),0);
  const total=totalMatchE+totalSubE;
  const played=allBookingRows.filter(r=>r.status==="played").length;
  const mLabel=fmtMonthYear(year,month,lang);

  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  const pdfContent=()=>{
    const isRTL=lang==="ar";
    return `<div style="font-family:${isRTL?"Cairo":"Nunito"},sans-serif;direction:${isRTL?"rtl":"ltr"};padding:20px;background:#fff;color:#111;">
      <div style="border-bottom:3px solid #00D48A;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><div style="font-size:22px;font-weight:900;color:#00D48A;">⚽ StadBook</div>
        <div style="font-size:11px;color:#888;font-weight:700;margin-top:2px;">${t.reportAll}</div>
        <div style="font-size:10px;color:#aaa;">${mode==="alltime"?t.since:mLabel}</div></div>
        <div style="text-align:right;"><div style="font-size:12px;font-weight:900;">${stadiumName}</div>
        <div style="font-size:9px;color:#bbb;">${t.generatedOn} ${new Date().toLocaleDateString(locale)}</div></div>
      </div>
      <div style="background:linear-gradient(135deg,#f0fdf8,#e6f9f2);border:2px solid #00D48A33;border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:9px;color:#00a86b;font-weight:700;margin-bottom:3px;">${t.totalGeneral.toUpperCase()}</div>
          <div style="font-size:32px;font-weight:900;color:#00a86b;line-height:1;">${total.toLocaleString()}</div>
          <div style="font-size:10px;color:#00a86b88;">${t.currency}</div></div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="background:#fff;border-radius:8px;padding:6px 10px;border:1px solid #00D48A22;">
              <div style="font-size:7px;color:#888;font-weight:700;">${t.matchEarn.toUpperCase()}</div>
              <div style="font-size:13px;font-weight:900;color:#00a86b;">${totalMatchE.toLocaleString()} ${t.currency}</div>
            </div>
            <div style="background:#fff;border-radius:8px;padding:6px 10px;border:1px solid #00b8ff22;">
              <div style="font-size:7px;color:#888;font-weight:700;">${t.subEarn.toUpperCase()}</div>
              <div style="font-size:13px;font-weight:900;color:#00b8ff;">${totalSubE.toLocaleString()} ${t.currency}</div>

          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;">
        <div style="border:1px solid #eee;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalMatches.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#4a90d9;">${played}</div>

        <div style="border:1px solid #eee;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:7px;color:#888;font-weight:700;margin-bottom:3px;">${t.totalSubsCount.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#00a86b;">${filteredSubs.length}</div>

        <div style="border:1px solid #ffe0e0;border-radius:8px;padding:8px;text-align:center;background:#fff8f8;">
          <div style="font-size:7px;color:#e05555;font-weight:700;margin-bottom:3px;">${t.unpaid.toUpperCase()}</div>
          <div style="font-size:16px;font-weight:900;color:#e05555;">${totalUnpaid.toLocaleString()}</div>
          <div style="font-size:8px;color:#e05555aa;">${t.currency}</div>
        </div>
      </div>

        <tbody>
          ${allBookingRows.slice(0,50).map((r,i)=>{
            const played=r.status==="played";const isSub=!!r.subId;
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">

          ${allBookingRows.length>50?`<tr><td colspan="5" style="padding:8px;text-align:center;color:#bbb;font-size:9px;">... ${allBookingRows.length-50} ${t.more}</td></tr>`:""}
        </tbody>
      </table>
      <div style="font-size:10px;font-weight:800;color:#333;letter-spacing:0.5px;margin-bottom:6px;">${t.allSubs.toUpperCase()} (${filteredSubs.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:10px;">
        <thead><tr style="background:#f5f5f5;">
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"العميل":lang==="fr"?"CLIENT":"CLIENT"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الساعة":"H"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الإجمالي":"TOTAL"}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${t.paid.toUpperCase()}</th>
          <th style="padding:6px 8px;text-align:${isRTL?"right":"left"};font-size:8px;color:#888;">${lang==="ar"?"الحالة":lang==="fr"?"STATUT":"STATUS"}</th>
        </tr></thead>
        <tbody>
          ${filteredSubs.map((s,i)=>{
            const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
            const rem=Math.max(0,(s.totalPrice||0)-paid);
            return `<tr style="border-bottom:1px solid #f0f0f0;background:${i%2===0?"#fff":"#fafafa"};">
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};font-weight:700;">${s.name||"—"}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#4a90d9;font-weight:700;">${fmt24(s.hour)}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};font-weight:800;">${(s.totalPrice||0).toLocaleString()}</td>
              <td style="padding:5px 8px;text-align:${isRTL?"right":"left"};color:#00a86b;font-weight:800;">${paid.toLocaleString()}</td>
              <td style="padding:5px 8px;"><span style="background:${rem===0?"#e6f9f2":"#fff0f0"};color:${rem===0?"#00a86b":"#e05555"};border-radius:4px;padding:1px 5px;font-size:8px;font-weight:700;">${rem===0?t.settled:`${rem.toLocaleString()} ${t.remaining}`}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="border-top:1px solid #eee;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;font-size:8px;color:#ccc;">
        <span>StadBook · ${t.reportAll}</span><span>${stadiumName}</span>
      </div>
    </div>`;
  };

  const generate=()=>{
    openPrint(pdfContent(),"StadBook_Complet");
  };

  return(
    <div style={{padding:"14px 12px",display:"flex",flexDirection:"column",gap:10}}>
      {/* Mode toggle */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <button onClick={()=>setMode("alltime")} style={{padding:"11px",borderRadius:12,border:"none",fontWeight:800,fontSize:12,background:mode==="alltime"?G:CARD,color:mode==="alltime"?G_DARK:"#555"}}>🕐 {t.allTime}</button>
        <button onClick={()=>setMode("bymonth")} style={{padding:"11px",borderRadius:12,border:`1px solid ${BORDER}`,fontWeight:800,fontSize:12,background:mode==="bymonth"?G:CARD,color:mode==="bymonth"?G_DARK:"#555"}}>📅 {t.byMonth}</button>
      </div>

      {/* Month picker (only if bymonth) */}
      {mode==="bymonth"&&(
        <div style={{background:CARD,borderRadius:14,padding:"12px 14px",border:`1px solid ${BORDER}`}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <button onClick={prevM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>‹</button>
            <div style={{fontWeight:900,fontSize:16,color:"#fff"}}>{mLabel}</div>
            <button onClick={nextM} style={{background:"#1c2030",border:"none",borderRadius:8,padding:"7px 14px",color:"#888",fontWeight:900,fontSize:18}}>›</button>
          </div>
        </div>
      )}

      {/* Big total */}
      <div style={{background:"linear-gradient(135deg,#071510,#0e2a1e)",borderRadius:16,padding:"16px",border:`1px solid ${G}44`}}>
        <div style={{fontSize:9,color:`${G}88`,fontWeight:700,letterSpacing:0.8,marginBottom:8}}>{mode==="alltime"?t.since.toUpperCase():mLabel.toUpperCase()}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:36,fontWeight:900,color:G,lineHeight:1}}>{total.toLocaleString()}</div>
            <div style={{fontSize:12,color:`${G}66`,marginTop:2}}>{t.currency}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <div style={{background:"#0D0F18",borderRadius:8,padding:"6px 10px",border:`1px solid ${G}33`}}>
              <div style={{fontSize:7,color:"#444",fontWeight:700}}>MATCHES</div>
              <div style={{fontSize:13,fontWeight:900,color:G}}>{totalMatchE.toLocaleString()} {t.currency}</div>
            </div>
            <div style={{background:"#0D0F18",borderRadius:8,padding:"6px 10px",border:"1px solid #00b8ff33"}}>
              <div style={{fontSize:7,color:"#444",fontWeight:700}}>ABONNEMENTS</div>
              <div style={{fontSize:13,fontWeight:900,color:"#00b8ff"}}>{totalSubE.toLocaleString()} {t.currency}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        <StatCard label={t.totalMatches} val={played} unit="" color="#7eb8ff" bg="#0a0e1f"/>
        <StatCard label={t.totalSubsCount} val={filteredSubs.length} unit="" color={G} bg="#071510"/>
        <StatCard label={t.unpaid} val={totalUnpaid.toLocaleString()} unit={t.currency} color="#ff5555" bg="#1f0e0e"/>
      </div>

      {/* Matches section */}
      <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{t.lastMatches.toUpperCase()}</div>
          <div style={{fontSize:9,color:G,fontWeight:700}}>{allBookingRows.length} total</div>
        </div>
        {allBookingRows.slice(0,8).map((r,i)=>{
          const isPlayed=r.status==="played";const isSub=!!r.subId;
          return(
            <div key={i} style={{padding:"9px 14px",borderBottom:i<Math.min(8,allBookingRows.length)-1?`1px solid ${BORDER}22`:"none",display:"flex",alignItems:"center",gap:8}}>
              <div style={{minWidth:36,height:36,borderRadius:8,background:isPlayed?isSub?"#d4a01722":`${G}22`:"#1c2030",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <span style={{fontSize:11,fontWeight:900,color:isPlayed?isSub?"#d4a017":G:"#555"}}>{fmt24(r.hour).slice(0,2)}</span>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:12,color:isPlayed?"#888":"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name||"—"}</div>
                <div style={{fontSize:9,color:"#444"}}>{fmtShort(r.dk,lang)} · {isSub?t.subLabel:isPlayed?t.played:t.reserved}{!isSub?` · ${r.price||0} ${t.currency}`:""}</div>
              </div>
              {isPlayed&&<span style={{fontSize:10,color:G,flexShrink:0}}>✓</span>}
            </div>
          );
        })}
        {allBookingRows.length>8&&(
          <div style={{padding:"8px 14px",background:"#071510",borderTop:`1px solid ${G}22`,textAlign:"center",fontSize:9,color:`${G}66`,fontWeight:700}}>+ {allBookingRows.length-8} {t.more}</div>
        )}
      </div>

      {/* Subs section */}
      <div style={{background:CARD,borderRadius:14,border:`1px solid ${BORDER}`,overflow:"hidden"}}>
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:9,color:"#555",fontWeight:700,letterSpacing:0.5}}>{t.allSubs.toUpperCase()}</div>
          <div style={{fontSize:9,color:"#00b8ff",fontWeight:700}}>{filteredSubs.length} total</div>
        </div>
        {filteredSubs.slice(0,6).map((s,i)=>{
          const paid=s.payments.reduce((a,p)=>a+(p.amount||0),0);
          const rem=Math.max(0,(s.totalPrice||0)-paid);
          return(
            <div key={s.id||i} style={{padding:"9px 14px",borderBottom:i<Math.min(6,filteredSubs.length)-1?`1px solid ${BORDER}22`:"none",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:800,fontSize:12,color:"#fff"}}>{s.name}</div>
                <div style={{fontSize:9,color:"#444",marginTop:1}}>{paid.toLocaleString()} / {(s.totalPrice||0).toLocaleString()} {t.currency}</div>
              </div>
              <Tag color={rem===0?G:"#ff5555"}>{rem===0?t.settled:`${rem.toLocaleString()} ${t.remaining}`}</Tag>
            </div>
          );
        })}
        {filteredSubs.length>6&&(
          <div style={{padding:"8px 14px",background:"#071510",borderTop:`1px solid ${G}22`,textAlign:"center",fontSize:9,color:`${G}66`,fontWeight:700}}>+ {filteredSubs.length-6} {t.more}</div>
        )}
      </div>

      <PdfBtn label={t.dlPdf} gen={false} onClick={generate}/>
    </div>
  );
}

// ── Shared components ─────────────────────────────────────────────────────────
function StatCard({label,val,unit,color,bg}){
  return(
    <div style={{background:bg,borderRadius:12,padding:"11px 8px",border:`1px solid ${BORDER}`,textAlign:"center"}}>
      <div style={{fontSize:7,color:"#555",fontWeight:700,letterSpacing:0.3,marginBottom:4}}>{label.toUpperCase()}</div>
      <div style={{fontSize:18,fontWeight:900,color}}>{val}</div>
      {unit&&<div style={{fontSize:8,color:"#444",marginTop:2}}>{unit}</div>}
    </div>
  );
}
function Tag({color,children}){
  return <span style={{background:`${color}18`,border:`1px solid ${color}33`,borderRadius:5,padding:"2px 7px",fontSize:9,fontWeight:700,color,whiteSpace:"nowrap"}}>{children}</span>;
}
function Empty({text}){
  return <div style={{background:CARD,borderRadius:14,padding:"30px 20px",border:`1px solid ${BORDER}`,textAlign:"center",color:"#333",fontSize:13,fontWeight:700}}>{text}</div>;
}
function PdfBtn({label,gen,onClick}){
  return(
    <button onClick={onClick} disabled={gen}
      style={{width:"100%",background:gen?"#0b2018":G,color:gen?G:G_DARK,border:gen?`1px solid ${G}44`:"none",borderRadius:14,padding:"14px",fontWeight:900,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
      {gen?<Spin s={18}/>:<DlIcon/>}
      {gen?T.fr.generating:label}
    </button>
  );
}


function openPrint(htmlContent,filename){
  const w=window.open("","_blank");
  if(!w){alert("Please allow popups to download PDF.");return;}
  const full='<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+filename+'</title>'+
    '<style>'+
    '*{box-sizing:border-box;margin:0;padding:0;}'+
    'body{font-family:Arial,sans-serif;background:#fff;color:#111;padding:20px;}'+
    'table{width:100%;border-collapse:collapse;font-size:11px;}'+
    'th{padding:7px 8px;font-size:8px;font-weight:800;color:#888;background:#f5f5f5;}'+
    'td{padding:6px 8px;border-bottom:1px solid #f0f0f0;}'+
    'tr:nth-child(even) td{background:#fafafa;}'+
    '@media print{@page{margin:10mm;}body{print-color-adjust:exact;-webkit-print-color-adjust:exact;}}'+
    '</style></head><body>'+htmlContent+
    '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},500);});<\/script>'+
    '</body></html>';
  w.document.open();
  w.document.write(full);
  w.document.close();
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
