function Confirm({icon,title,sub,label,bbg,bc,onOk,onCancel}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}} onClick={onCancel}>
      <div onClick={e=>e.stopPropagation()} style={{background:CARD,borderRadius:22,padding:"28px 22px",width:"100%",maxWidth:360,border:"1px solid "+BORDER,animation:"popIn 0.2s ease"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>{icon}</div>
        <div style={{fontWeight:900,fontSize:17,color:"#fff",textAlign:"center",marginBottom:sub?8:22}}>{title}</div>
        {sub&&<div style={{fontSize:13,color:"#888",textAlign:"center",marginBottom:22,fontWeight:700}}>{sub}</div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onCancel} style={{flex:1,background:"#1c2030",color:"#888",border:"none",borderRadius:12,padding:"14px",fontWeight:700,fontSize:14}}>Annuler</button>
          <button onClick={onOk} style={{flex:2,background:bbg||G,color:bc||"#001a0e",border:"none",borderRadius:12,padding:"14px",fontWeight:900,fontSize:15}}>{label}</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [lang,setLang]=useState("fr");
  const [authUser,setAuthUser]=useState(undefined);
  const [error,setError]=useState("");
  useEffect(()=>{const unsub=auth.onAuthStateChanged(u=>setAuthUser(u));return unsub;},[]);
  if(authUser===undefined) return(<div style={{background:BG,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:36,height:36,border:"3px solid "+G,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/></div>);
  if(!authUser) return <LoginScreen lang={lang} setLang={setLang} onError={setError} error={error}/>;
  if(authUser.email!==ADMIN_EMAIL){auth.signOut();return <div style={{background:BG,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#ff5555",fontSize:16,fontWeight:800}}>{T[lang].errorAccess}</div>;}
  return <MainScreen lang={lang} setLang={setLang}/>;
}

function LoginScreen({lang,setLang,onError,error}){
  const t=T[lang],isRTL=lang==="ar";
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [loading,setLoading]=useState(false);
  const handleLogin=async()=>{
    setLoading(true);
    try{await auth.signInWithEmailAndPassword(email,password);}
    catch(e){onError(t.errorAccess);}
    setLoading(false);
  };
  return(
    <div style={{fontFamily:isRTL?"'Cairo',sans-serif":"'Nunito',sans-serif",direction:isRTL?"rtl":"ltr",background:BG,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:48,marginBottom:8}}>⚽</div>
      <div style={{fontSize:26,fontWeight:900,color:G,marginBottom:4}}>StadBook</div>
      <div style={{fontSize:12,color:"#444",marginBottom:32}}>{t.title}</div>
      <div style={{display:"flex",gap:8,marginBottom:24}}>{["fr","en","ar"].map(l=>(<button key={l} onClick={()=>setLang(l)} style={{background:lang===l?G:CARD,border:"1.5px solid "+(lang===l?G:BORDER),borderRadius:10,padding:"6px 12px",fontWeight:800,fontSize:12,color:lang===l?"#001a0e":"#555"}}>{FLAGS[l]} {LANG_LABELS[l]}</button>))}</div>
      <div style={{background:CARD,borderRadius:20,padding:"24px 20px",width:"100%",maxWidth:360,border:"1px solid "+BORDER}}>
        <div style={{marginBottom:14}}><div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6}}>{t.email.toUpperCase()}</div><input value={email} onChange={e=>setEmail(e.target.value)} type="email" style={{width:"100%",background:BG,border:"2px solid "+BORDER,borderRadius:12,padding:"12px 14px",color:"#fff",fontSize:15}} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/></div>
        <div style={{marginBottom:20}}><div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6}}>{t.password.toUpperCase()}</div><input value={password} onChange={e=>setPassword(e.target.value)} type="password" onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={{width:"100%",background:BG,border:"2px solid "+BORDER,borderRadius:12,padding:"12px 14px",color:"#fff",fontSize:15}} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/></div>
        {error&&<div style={{background:"#1f0e0e",border:"1px solid #2e1414",borderRadius:10,padding:"10px 14px",color:"#ff5555",fontSize:13,marginBottom:14,fontWeight:700}}>{error}</div>}
        <button onClick={handleLogin} disabled={loading} style={{width:"100%",background:G,color:"#001a0e",border:"none",borderRadius:12,padding:"14px",fontWeight:900,fontSize:15,opacity:loading?0.7:1}}>{loading?t.loading:t.loginBtn}</button>
      </div>
    </div>
  );
}

function MainScreen({lang,setLang}){
  const t=T[lang],isRTL=lang==="ar";
  const [tab,setTab]=useState("accounts");
  const [users,setUsers]=useState([]);
  const [price,setPrice]=useState(500);
  const [payments,setPayments]=useState({});
  const [lockDay,setLockDay]=useState(null);
  const [partners,setPartners]=useState([]);
  const [partnerPaid,setPartnerPaid]=useState({});
  const [partnerPrice,setPartnerPrice]=useState(100);
  const [loading,setLoading]=useState(true);
  const [contactInfo,setContactInfo]=useState({whatsapp:"",messages:{fr:"Besoin d'acces ? Contactez-nous sur WhatsApp.",en:"Need access? Contact us on WhatsApp.",ar:"تريد الوصول؟ تواصل معنا على واتساب."}});

  useEffect(()=>{
    const unsub=db.collection("users").onSnapshot(snap=>{
      setUsers(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const unsub=db.collection("payments").doc("data").onSnapshot(snap=>{
      if(snap.exists){
        const d=snap.data();
        if(d.payments) setPayments(d.payments);
        if(d.price) setPrice(d.price);
        if(d.lockDay!==undefined) setLockDay(d.lockDay||null);
      }
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const unsub=db.collection("payments").doc("partners").onSnapshot(snap=>{
      if(snap.exists){
        const d=snap.data();
        if(d.partners) setPartners(d.partners);
        if(d.partnerPaid) setPartnerPaid(d.partnerPaid);
        if(d.partnerPrice) setPartnerPrice(d.partnerPrice);
      }
    });
    return unsub;
  },[]);

  useEffect(()=>{
    const unsub=db.collection("settings").doc("contact").onSnapshot(snap=>{
      if(snap.exists) setContactInfo(snap.data());
    },()=>{});
    return unsub;
  },[]);

  useEffect(()=>{
    if(!lockDay||!payments||users.length===0) return;
    const now=new Date();
    if(now.getDate()!==lockDay) return;
    const mk=now.getFullYear()+"-"+now.getMonth();
    users.forEach(u=>{
      if(u.active&&!(payments[mk]&&payments[mk][u.id])){
        db.collection("users").doc(u.id).update({active:false}).catch(()=>{});
      }
    });
  },[lockDay,payments,users]);

  const savePayData=async(np,npr,nld)=>{
    await db.collection("payments").doc("data").set({
      payments:np!==undefined?np:payments,
      price:npr!==undefined?npr:price,
      lockDay:nld!==undefined?nld:lockDay,
    },{merge:true});
  };

  const savePartData=async(np,npp,npc)=>{
    await db.collection("payments").doc("partners").set({
      partners:np!==undefined?np:partners,
      partnerPaid:npp!==undefined?npp:partnerPaid,
      partnerPrice:npc!==undefined?npc:partnerPrice,
    },{merge:false});
  };

  return(
    <div style={{fontFamily:isRTL?"'Cairo',sans-serif":"'Nunito',sans-serif",direction:isRTL?"rtl":"ltr",maxWidth:430,margin:"0 auto",minHeight:"100vh",background:BG,color:"#f0f0f0",paddingBottom:40}}>
      <div style={{background:CARD,padding:"14px 16px",borderBottom:"1px solid "+BORDER,position:"sticky",top:0,zIndex:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:18,fontWeight:900,color:G}}>⚽ StadBook</div><div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:1}}>{t.title.toUpperCase()}</div></div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {["fr","en","ar"].map(l=>(<button key={l} onClick={()=>setLang(l)} style={{background:lang===l?G:"#1c2030",border:"none",borderRadius:8,padding:"5px 8px",fontWeight:800,fontSize:10,color:lang===l?"#001a0e":"#555"}}>{FLAGS[l]} {LANG_LABELS[l]}</button>))}
          <button onClick={()=>auth.signOut()} style={{background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:8,padding:"6px 10px",fontWeight:700,fontSize:11,marginLeft:4}}>{t.signOut}</button>
        </div>
      </div>

      <div style={{display:"flex",borderBottom:"1px solid "+BORDER,overflowX:"auto"}}>
        {[["accounts",t.accounts],["payments",t.payments],["partners",t.partners],["activity",t.activity],["settings",t.settings]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:"0 0 auto",padding:"12px 12px",background:"none",border:"none",fontWeight:800,fontSize:11.5,color:tab===id?G:"#444",borderBottom:tab===id?"2px solid "+G:"2px solid transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5,whiteSpace:"nowrap"}}>
            {id==="accounts"?<IUsers s={13} c={tab===id?G:"#444"}/>:id==="payments"?<IMoney s={13} c={tab===id?G:"#444"}/>:id==="partners"?<IUsers s={13} c={tab===id?G:"#444"}/>:id==="activity"?<IActivity s={13} c={tab===id?G:"#444"}/>:<ISettings s={13} c={tab===id?G:"#444"}/>}
            {label}
          </button>
        ))}
      </div>

      {tab==="accounts" && <AccountsTab lang={lang} t={t} users={users}/>}
      {tab==="payments" && <PayTab lang={lang} t={t} users={users} setUsers={setUsers} price={price} setPrice={setPrice} payments={payments} setPayments={setPayments} lockDay={lockDay} setLockDay={setLockDay} loading={loading} savePayData={savePayData}/>}
      {tab==="partners" && <PartTab lang={lang} t={t} users={users} partners={partners} setPartners={setPartners} partnerPaid={partnerPaid} setPartnerPaid={setPartnerPaid} partnerPrice={partnerPrice} setPartnerPrice={setPartnerPrice} savePartData={savePartData}/>}
      {tab==="activity" && <ActTab lang={lang} t={t} users={users} loading={loading}/>}
      {tab==="settings" && <SettingsTab lang={lang} t={t} contactInfo={contactInfo} setContactInfo={setContactInfo}/>}
    </div>
  );
}

function SettingsTab({lang,t,contactInfo,setContactInfo}){
  const [tempWA,setTempWA]=useState(contactInfo.whatsapp||"");
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");

  useEffect(()=>{ setTempWA(contactInfo.whatsapp||""); },[contactInfo]);

  const handleSave=async()=>{
    if(!tempWA.trim()) return;
    setSaving(true);
    try{
      await db.collection("settings").doc("contact").set({whatsapp:tempWA},{merge:true});
      setContactInfo(prev=>({...prev,whatsapp:tempWA}));
      setSaveMsg("✓ "+tempWA);
      setTimeout(()=>setSaveMsg(""),3000);
    } catch(e){ setSaveMsg("Error: "+e.message); }
    setSaving(false);
  };

  return(
    <div style={{padding:"16px 14px 40px"}}>
      <div style={{background:CARD,borderRadius:16,padding:"18px",border:"1px solid "+BORDER,marginBottom:12}}>
        <div style={{fontSize:11,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:14}}>{t.contactInfo.toUpperCase()}</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:"#555",fontWeight:700,marginBottom:6}}>WHATSAPP</div>
          <input value={tempWA} onChange={e=>setTempWA(e.target.value.replace(/\D/g,""))} type="tel" inputMode="numeric"
            style={{width:"100%",background:BG,border:"2px solid "+BORDER,borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:16}}
            onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
        </div>
        <button onClick={handleSave} disabled={saving} style={{width:"100%",background:saving?"#1c2030":G,color:saving?"#555":"#001a0e",border:"none",borderRadius:10,padding:"12px",fontWeight:900,fontSize:14}}>
          {saveMsg?saveMsg:saving?t.translating:t.saveContact}

      <div style={{background:G+"15",borderRadius:16,padding:"14px 16px",border:"1.5px solid "+G+"55"}}>
        <div style={{fontSize:10,color:G,fontWeight:800,marginBottom:8}}>{t.preview}</div>
        <div style={{fontSize:13,color:G,fontWeight:800}}>📞 {tempWA||"—"}</div>
      </div>
    </div>
  );
}

function ActTab({lang,t,users,loading}){
  const [bookingsMap,setBookingsMap]=useState({});
  const [subsMap,setSubsMap]=useState({});

  useEffect(()=>{
    const unsubs=[];
    users.forEach(u=>{
      const unsubB=db.collection("bookings").doc(u.id).onSnapshot(snap=>{
        let count=0;
        if(snap.exists){
          const data=snap.data().data||{};
          Object.keys(data).forEach(dk=>{
            const slots=data[dk]||{};
            count+=Object.keys(slots).filter(k=>!isNaN(Number(k))).length;
          });
        }
        setBookingsMap(prev=>({...prev,[u.id]:count}));
      },()=>{});
      const unsubS=db.collection("subs").doc(u.id).onSnapshot(snap=>{
        const count=snap.exists?(snap.data().list||[]).length:0;
        setSubsMap(prev=>({...prev,[u.id]:count}));
      },()=>{});
      unsubs.push(unsubB,unsubS);
    });
    return ()=>unsubs.forEach(fn=>fn());
  },[users]);

  const enriched=users.map(u=>{
    const bookingCount=bookingsMap[u.id]||0;
    const subCount=subsMap[u.id]||0;
    return {...u,bookingCount,subCount,hasData:(bookingCount>0||subCount>0)};
  });

  const total=enriched.length;
  const usedCount=enriched.filter(u=>u.hasData).length;

  enriched.sort((a,b)=>{
    if(a.hasData!==b.hasData) return (b.hasData?1:0)-(a.hasData?1:0);
    if(!!a.active!==!!b.active) return (b.active?1:0)-(a.active?1:0);
    return (a.stadiumName||"").localeCompare(b.stadiumName||"");
  });

  return(
    <div style={{padding:"16px 14px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:G,animation:"pulse 1.5s ease infinite"}}/>
        <div style={{fontSize:11,color:"#444",fontWeight:700}}>{t.live}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,margin:"10px 0 16px"}}>
        <div style={{background:CARD,borderRadius:14,padding:"12px",border:"1px solid "+BORDER,textAlign:"center"}}>
          <div style={{fontSize:9,color:"#444",fontWeight:700,marginBottom:4}}>{t.totalUsers}</div>
          <div style={{fontSize:24,fontWeight:900,color:"#fff"}}>{total}</div>
        </div>
        <div style={{background:CARD,borderRadius:14,padding:"12px",border:"1px solid "+BORDER,textAlign:"center"}}>
          <div style={{fontSize:9,color:"#444",fontWeight:700,marginBottom:4}}>{t.active.toUpperCase()}</div>
          <div style={{fontSize:24,fontWeight:900,color:G}}>{enriched.filter(u=>u.active).length}</div>
        </div>
        <div style={{background:CARD,borderRadius:14,padding:"12px",border:"1px solid "+BORDER,textAlign:"center"}}>
          <div style={{fontSize:9,color:"#444",fontWeight:700,marginBottom:4}}>{t.usedApp}</div>
          <div style={{fontSize:24,fontWeight:900,color:"#00b8ff"}}>{usedCount}</div>
        </div>
      </div>
      {loading&&<div style={{textAlign:"center",color:"#444",padding:"30px 0"}}>{t.loading}</div>}
      {!loading&&enriched.length===0&&<div style={{textAlign:"center",color:"#333",padding:"30px 0"}}>{t.noUsers}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {enriched.map(u=>(
          <div key={u.id} style={{background:CARD,borderRadius:14,padding:"14px",border:"1.5px solid "+(u.hasData?G+"66":BORDER)}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:900,fontSize:15,color:"#fff"}}>⚽ {u.stadiumName||"-"}</div>
                <div style={{fontSize:12,color:"#444",marginTop:2}}>{u.email}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                <span style={{fontSize:10,fontWeight:800,padding:"3px 9px",borderRadius:20,background:u.active?G+"22":"#ff995522",color:u.active?G:"#ff9955"}}>{u.active?t.active:t.inactive}</span>
                <span style={{fontSize:10,fontWeight:800,padding:"3px 9px",borderRadius:20,background:u.hasData?"#00b8ff22":"#33333355",color:u.hasData?"#00b8ff":"#888"}}>{u.hasData?t.usedBadge:t.notUsedBadge}</span>
              </div>
            </div>
            {u.hasData&&<div style={{fontSize:11,color:"#555",marginTop:8}}>📅 {u.bookingCount} {t.bookingsCount} · 📋 {u.subCount} {t.subsCount}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}
function PayTab({lang,t,users,setUsers,price,setPrice,payments,setPayments,lockDay,setLockDay,loading,savePayData}){
  const now=new Date();
  const [editP,setEditP]=useState(false);
  const [tmpP,setTmpP]=useState(price);
  const [month,setMonth]=useState(now.getMonth());
  const [year,setYear]=useState(now.getFullYear());
  const [search,setSearch]=useState("");
  const [selecting,setSelecting]=useState(false);
  const [selected,setSelected]=useState(new Set());
  const [confirm,setConfirm]=useState(null);

  const mk=year+"-"+month;
  const isPaid=uid=>!!(payments[mk]&&payments[mk][uid]);
  const filtered=users.filter(u=>u.stadiumName&&(u.stadiumName.toLowerCase().includes(search.toLowerCase())||(u.email&&u.email.toLowerCase().includes(search.toLowerCase()))));
  const paidCount=users.filter(u=>isPaid(u.id)).length;
  const unpaidCount=users.length-paidCount;
  const pct=users.length>0?Math.round(paidCount/users.length*100):0;
  const selArr=[...selected];

  const doToggle=async(uid)=>{
    const wasPaid=isPaid(uid);
    const np={...payments,[mk]:{...(payments[mk]||{}),[uid]:!wasPaid}};
    setPayments(np);
    await db.collection("users").doc(uid).update({active:!wasPaid}).catch(()=>{});
    setUsers(us=>us.map(u=>u.id===uid?{...u,active:!wasPaid}:u));
    await savePayData(np,price,lockDay);
  };

  const doBulk=async()=>{
    const np={...payments,[mk]:{...(payments[mk]||{})}};
    selected.forEach(uid=>{np[mk][uid]=true;});
    setPayments(np);
    const proms=[];
    selected.forEach(uid=>proms.push(db.collection("users").doc(uid).update({active:true}).catch(()=>{})));
    await Promise.all(proms);
    setUsers(us=>us.map(u=>selected.has(u.id)?{...u,active:true}:u));
    setSelected(new Set());setSelecting(false);
    await savePayData(np,price,lockDay);
  };

  const saveLockDay=async(val)=>{setLockDay(val);await savePayData(payments,price,val);};
  const savePrice=async(val)=>{setPrice(val);setEditP(false);await savePayData(payments,val,lockDay);};

  return(
    <div style={{padding:"16px",paddingBottom:40}}>
      {confirm&&confirm.t==="paid"&&<Confirm icon={<IMoney s={36}/>} title={t.confirmMarkPaid} sub={confirm.name} label={t.markPaid} bbg={G} bc="#001a0e" onOk={()=>{doToggle(confirm.uid);setConfirm(null);}} onCancel={()=>setConfirm(null)}/>}
      {confirm&&confirm.t==="unpaid"&&<Confirm icon={<ILock s={36} c="#ff9944"/>} title={t.confirmMarkUnpaid} sub={confirm.name} label={t.confirm} bbg="#ff9944" bc="#fff" onOk={()=>{doToggle(confirm.uid);setConfirm(null);}} onCancel={()=>setConfirm(null)}/>}
      {confirm&&confirm.t==="bulk"&&<Confirm icon={<ICSq s={36}/>} title={t.confirmBulk} sub={confirm.count} label={t.markSelectedPaid} bbg={G} bc="#001a0e" onOk={()=>{doBulk();setConfirm(null);}} onCancel={()=>setConfirm(null)}/>}

      <div style={{background:CARD,borderRadius:16,padding:"14px 16px",border:"1px solid "+(lockDay?"#ff994466":BORDER),marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
          <ILock s={13} c={lockDay?"#ff9944":"#555"}/>
          <div style={{fontSize:10,color:lockDay?"#ff9944":"#555",fontWeight:800,letterSpacing:0.5}}>{t.autoLock.toUpperCase()}</div>
        </div>
        <select value={lockDay||""} onChange={e=>saveLockDay(e.target.value?Number(e.target.value):null)} style={{width:"100%",background:BG,border:"2px solid "+(lockDay?"#ff994466":BORDER),borderRadius:12,padding:"11px 14px",color:lockDay?"#ff9944":"#888",fontSize:14,fontWeight:700}}>
          <option value="">{t.autoLockNone}</option>
          {Array.from({length:28},(_,i)=>i+1).map(d=><option key={d} value={d}>{t.day} {d}</option>)}
        </select>
      </div>

      <div style={{background:CARD,borderRadius:16,padding:"16px",border:"1px solid "+BORDER,marginBottom:14}}>
        <div style={{fontSize:10,color:"#444",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>{t.price.toUpperCase()}</div>
        {editP
          ?<div style={{display:"flex",gap:8}}><input type="number" value={tmpP} onChange={e=>setTmpP(Number(e.target.value))} autoFocus style={{flex:1,background:BG,border:"2px solid "+G,borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:15}}/><button onClick={()=>savePrice(tmpP)} style={{background:G,color:"#001a0e",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:900}}>✓</button><button onClick={()=>setEditP(false)} style={{background:"#1c2030",color:"#888",border:"none",borderRadius:10,padding:"10px 14px"}}>x</button></div>

                              <div style={{fontSize:10,color:u.active?"#444":"#6a2a2a",marginTop:1}}>{u.email}</div>
                            </div>
                            <div style={{display:"flex",alignItems:"center",gap:6}}>
                              <div style={{fontSize:10,fontWeight:800,padding:"3px 8px",borderRadius:20,background:u.active?G+"22":"#ff555522",color:u.active?G:"#ff5555"}}>{u.active?t.active:t.inactive}</div>
                              <button onClick={()=>setModal({t:"removeClient",pid:p.id,uid,name:u.stadiumName})} style={{background:"#1f0e0e",border:"1px solid #2e1414",borderRadius:8,padding:"4px 8px",color:"#ff5555",fontWeight:900,fontSize:13,cursor:"pointer"}}>✕</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  }
                  <button onClick={()=>setModal({t:"assign",pid:p.id})} style={{width:"100%",background:G+"18",color:G,border:"1px solid "+G+"44",borderRadius:10,padding:"9px",fontWeight:900,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><IPlus/> {t.assignClient}</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      {modal?.t==="removeClient"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}} onClick={()=>setModal(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:CARD,borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:360,border:"1px solid #2e1414"}}>
            <div style={{fontSize:30,textAlign:"center",marginBottom:12}}>⚠️</div>
            <div style={{fontWeight:900,fontSize:16,color:"#fff",textAlign:"center",marginBottom:8}}>{lang==="ar"?"تأكيد الحذف":lang==="fr"?"Confirmer la suppression":"Confirm Delete"}</div>
            <div style={{fontSize:13,color:"#ff5555",textAlign:"center",marginBottom:24,fontWeight:700}}>{modal.name}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setModal(null)} style={{flex:1,background:"#1c2030",color:"#888",border:"none",borderRadius:12,padding:"13px",fontWeight:700,fontSize:14}}>{lang==="ar"?"إلغاء":lang==="fr"?"Annuler":"Cancel"}</button>
              <button onClick={async()=>{const np=partners.map(x=>x.id===modal.pid?{...x,clients:x.clients.filter(c=>c!==modal.uid)}:x);setPartners(np);setModal(null);await savePartData(np,partnerPaid,partnerPrice);}} style={{flex:1,background:"#1f0e0e",color:"#ff5555",border:"1px solid #2e1414",borderRadius:12,padding:"13px",fontWeight:900,fontSize:14}}>🗑️</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
